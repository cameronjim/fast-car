name: CI

# Per claude-docs/12-testing.md "CI wiring": every push runs L1-L3, L4-small,
# L5-short, and merge is blocked on green - there are no skip labels. See
# claude-docs/01-roadmap.md task 0.6 and claude-docs/03-environments.md for
# which pinned images each job is meant to run in once those images exist
# (docker/sim-cpu is task 0.2, docker/ros-dev is task 0.4). Every job below
# that stands in for one of those images says so in a comment.

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff + clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check + ruff format --check
        run: .github/scripts/lint_python.sh

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: clang-format --dry-run -Werror
        run: .github/scripts/lint_cpp.sh

  unit-and-property:
    name: L1 unit + L2 property (pytest)
    runs-on: ubuntu-latest
    # INTERIM: claude-docs/03-environments.md says Python tests run in the
    # `sim-cpu` image. That image now exists (docker/sim-cpu/: Dockerfile +
    # uv.lock, built and headless-gym-smoke-tested by the sim-cpu-image job
    # below - roadmap task 0.2) but this job still uses bare ubuntu-latest +
    # uv, because none of the packages exercised here import racer_gym or
    # torch yet; swapping this job onto the built image now would add
    # container-build latency to every push for no behavioral gain.
    # TODO(task 0.2 follow-up): once a Python package under test here
    # actually imports racer_gym/torch (training/, sim/ code lands), run
    # that package's tests inside the sim-cpu image instead of bare
    # ubuntu-latest + uv.
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv only tags rolling majors up through v7; v8+ are
      # exact-version tags only, so this is pinned to the exact latest
      # release rather than a rolling major tag.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: pytest + coverage gates per package
        run: .github/scripts/run_python_tests.sh

  l3-and-cpp:
    name: L3 node tests + C++ build (ros-dev)
    runs-on: ubuntu-latest
    # INTERIM CONTAINER, KEPT DELIBERATELY (task 0.4 decision): the repo's
    # own `ros-dev` image now exists (docker/ros-dev/, roadmap task 0.4,
    # built + smoke-tested by the ros-dev-image job below) but this job
    # still uses the stock `ros:humble` image rather than swapping onto it.
    # Reason: `container:` jobs need a pullable image reference before any
    # step runs, so using our own freshly-built image here would mean
    # trading this job's shape for the sim-cpu-image/train-cuda-image
    # pattern (build with buildx, then `docker run -v $PWD:/repo ...`
    # instead of `container:`) -- a real increase in job complexity and a
    # docker-build-with-cache step added to a job that runs on EVERY push
    # (unlike the path-filtered image-build jobs). ros_ws/src has no real
    # packages yet, so that swap would buy zero additional test coverage
    # right now. Deferring until a roadmap task lands actual packages under
    # ros_ws/src, at which point the swap is worth the added job shape.
    # TODO(task 0.4 follow-up): once ros_ws/src has real packages, point
    # this job at the built ros-dev image (see ros-dev-image job for the
    # build step to reuse) and drop the apt-get bootstrap below.
    container:
      image: ros:humble
    steps:
      - name: Install git + colcon (interim bootstrap, see TODO above)
        run: |
          apt-get update
          apt-get install -y git python3-colcon-common-extensions build-essential
          # Container jobs check out as a different uid than the one that
          # owns the bind-mounted workspace, which git refuses to touch by
          # default ("dubious ownership"). Mark it safe before checkout.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: colcon build + colcon test
        run: .github/scripts/ros_build_test.sh

  sim-bridge-test:
    name: sim/bridge racer_gym_bridge build + test (ros-dev + gym)
    runs-on: ubuntu-latest
    # Roadmap task 0.5: the gym<->ROS bridge. Builds this repo's own
    # `ros-dev` image (docker/ros-dev/, roadmap task 0.4) -- which now
    # carries the pinned f1tenth_gym dependency for this job, see
    # docker/ros-dev/pyproject.toml -- and runs `colcon build` +
    # `colcon test` for sim/bridge/racer_gym_bridge inside it. See
    # .github/scripts/sim_bridge_build_test.sh for how f1tenth_gym is made
    # importable to the system python3.10 that rclpy/colcon use, without
    # shadowing python3 the way prepending the whole uv venv to PATH would.
    #
    # Separate job rather than folding into l3-and-cpp: that job
    # deliberately still runs in the stock `ros:humble` image (see its own
    # comment) and does not carry f1tenth_gym; this needed its own
    # container shape and it wasn't worth re-plumbing that job for one
    # package. Runs on every push (unlike the path-filtered
    # `ros-dev-image` job below) since sim/bridge changes independently of
    # docker/ros-dev/ -- on a push that touches both, the image gets built
    # twice (no cross-job cache sharing mid-run), which is accepted cost
    # for keeping each job simple; `cache-from/to: type=gha` still makes
    # repeat builds on unrelated pushes fast.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ros-dev image
        uses: docker/build-push-action@v6
        with:
          context: docker/ros-dev
          tags: ros-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: colcon build + colcon test sim/bridge/racer_gym_bridge
        # --shm-size: rclpy's default RMW (Fast-DDS) uses a shared-memory
        # transport that needs more than docker's 64 MB default /dev/shm;
        # under the default size the launch_testing node process aborts
        # (SIGABRT, "terminate called without an active exception", no
        # Python traceback -- a native allocation failure below rclpy) as
        # soon as the bridge node's publishers/subscriptions are created.
        # This is the standard fix for rclpy-in-Docker, not a workaround
        # for anything specific to this package.
        run: |
          docker run --rm --shm-size=1gb -v "${{ github.workspace }}:/workspace" -w /workspace \
            --entrypoint bash ros-dev:ci -c "./.github/scripts/sim_bridge_build_test.sh"

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      sim_cpu: ${{ steps.filter.outputs.sim_cpu }}
      train_cuda: ${{ steps.filter.outputs.train_cuda }}
      ros_dev: ${{ steps.filter.outputs.ros_dev }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sim_cpu:
              - 'docker/sim-cpu/**'
              - '.github/workflows/ci.yml'
            train_cuda:
              - 'docker/train-cuda/**'
              - '.github/workflows/ci.yml'
            ros_dev:
              - 'docker/ros-dev/**'
              - '.github/workflows/ci.yml'

  sim-cpu-image:
    name: sim-cpu image build + headless gym smoke test
    needs: changes
    if: needs.changes.outputs.sim_cpu == 'true'
    runs-on: ubuntu-latest
    # Builds docker/sim-cpu (roadmap task 0.2) and runs the container's
    # default CMD, docker/sim-cpu/smoke_test.py, inside it. That script is
    # the "f1tenth_gym runs headless in it" proof: it builds an f1tenth_gym
    # env with no display/render, steps it a few hundred times with a
    # trivial controller asserting finite observations throughout, then
    # imports torch and asserts a CPU tensor op works and that CUDA is not
    # visible. A nonzero container exit fails this job.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build sim-cpu image
        uses: docker/build-push-action@v6
        with:
          context: docker/sim-cpu
          tags: sim-cpu:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run headless gym + torch smoke test inside the built image
        run: docker run --rm sim-cpu:ci

  train-cuda-image:
    name: train-cuda image build + CPU-safe sanity (no GPU in CI)
    needs: changes
    if: needs.changes.outputs.train_cuda == 'true'
    runs-on: ubuntu-latest
    # Builds docker/train-cuda (roadmap task 0.3) and proves it BUILDS from
    # the Dockerfile + uv.lock alone. This job intentionally does NOT run
    # docker/train-cuda/gpu_check.py: ubuntu-latest runners have no NVIDIA
    # GPU, so `torch.cuda.is_available()` would correctly be False here and
    # the check would fail for a reason that has nothing to do with whether
    # the image is correct. "torch sees the GPU" (the roadmap 0.3 done
    # criterion) can only be verified on Desktop A -- see
    # docker/train-cuda/README.md for the exact `docker run --gpus all`
    # command the owner runs there, and claude-docs/01-roadmap.md for the
    # [~] note tracking that this is still open.
    #
    # What this job runs instead is a CPU-safe sanity check inside the
    # built image: import torch, print the CUDA build torch was compiled
    # against, and assert it is a +cu126 wheel (i.e. the cu126 index was
    # actually used and torch did not silently fall back to a CPU-only or
    # different-CUDA-version build). That's everything that can honestly be
    # proven without a GPU.
    steps:
      - uses: actions/checkout@v7

      # cu126 torch + cuDNN/cuBLAS/cuSPARSE/NCCL/triton is a large
      # dependency set (~3.8 GB of wheels per docker/train-cuda/uv.lock).
      # ubuntu-latest runners ship with several large preinstalled
      # toolchains this job never uses (Android SDK, .NET, GHC, CodeQL);
      # clear them first so the docker build + layer cache don't hit disk
      # pressure. This is a disk-cleanup step, not a dependency-locking
      # shortcut -- uv.lock is still the sole source of what gets installed.
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
              /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build train-cuda image
        uses: docker/build-push-action@v6
        with:
          context: docker/train-cuda
          tags: train-cuda:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CPU-safe sanity check inside the built image (no GPU available in CI)
        run: |
          docker run --rm --entrypoint python train-cuda:ci -c "
          import torch
          print(f'torch version: {torch.__version__}')
          print(f'torch.version.cuda: {torch.version.cuda}')
          assert '+cu126' in torch.__version__, (
              f'expected a +cu126 torch build, got {torch.__version__!r}'
          )
          assert torch.version.cuda == '12.6', (
              f'expected torch.version.cuda == \"12.6\", got {torch.version.cuda!r}'
          )
          print('train-cuda CPU-safe sanity check OK (cu126 wheel confirmed; '
                'GPU availability is NOT checked here, see job comment)')
          "

  ros-dev-image:
    name: ros-dev image build + colcon toolchain smoke test
    needs: changes
    if: needs.changes.outputs.ros_dev == 'true'
    runs-on: ubuntu-latest
    # Builds docker/ros-dev (roadmap task 0.4) and runs the container's
    # default CMD, docker/ros-dev/smoke_test.sh, inside it. That script is
    # the "toolchain actually builds and tests ROS 2 packages" proof: it
    # creates a throwaway ament_cmake (gtest) package and a throwaway
    # ament_python (pytest) package in a scratch workspace, runs `colcon
    # build` + `colcon test` on both, and fails the job unless every test
    # passes. A nonzero container exit fails this job.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ros-dev image
        uses: docker/build-push-action@v6
        with:
          context: docker/ros-dev
          tags: ros-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run colcon build+test smoke test inside the built image
        run: docker run --rm ros-dev:ci

  l4-small-l5-short:
    name: L4-small replay + L5-short sim-in-loop
    runs-on: ubuntu-latest
    # Roadmap task 0.9 landed the L4/L5 harness frameworks
    # (tests/replay_harness, tests/sim_in_loop) and this job now runs their
    # self-tests as the L4-small/L5-short content -- see the script's own
    # header comment for why that's a stand-in, not a real replay/sim-in-loop
    # run, until tasks 2.8 (real bags) / S.2 (tracker lap test) land.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: L4-small / L5-short harness self-tests
        run: .github/scripts/l4_l5_placeholder.sh
