name: Racer desktop

# The Racer desktop app (tools/racer_app/desktop, a Tauri shell around tools/racer_app/web).
# Separate from CI on purpose: the Rust and bundling work is slow and only matters when the app
# changes, so it only runs for changes under tools/racer_app. No signing secrets are used:
# the bundles are unsigned (docs/notes/racer-app-2026-11-11.md, "Desktop app").

on:
  push:
    branches: [main]
    paths:
      - "tools/racer_app/**"
      - ".github/workflows/racer-desktop.yml"
  pull_request:
    paths:
      - "tools/racer_app/**"
      - ".github/workflows/racer-desktop.yml"
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "22.12.0"

jobs:
  check:
    name: Rust compile, fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libgtk-3-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/racer_app/desktop/src-tauri/target
          key: racer-desktop-check-${{ hashFiles('tools/racer_app/desktop/src-tauri/Cargo.lock') }}

      - name: Build the web UI (Tauri embeds it at compile time)
        run: |
          npm ci
          npm run build
        working-directory: tools/racer_app/web

      - name: rustfmt
        run: cargo fmt --check
        working-directory: tools/racer_app/desktop/src-tauri

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: tools/racer_app/desktop/src-tauri

      - name: Unit tests (discovery with a fake resolver, token store, last car)
        run: cargo test --locked
        working-directory: tools/racer_app/desktop/src-tauri

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: racer-desktop-macos
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
            artifact: racer-desktop-windows
          - name: Linux
            os: ubuntu-latest
            bundles: appimage,deb
            artifact: racer-desktop-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Tauri's Linux libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libgtk-3-dev patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/racer_app/desktop/src-tauri/target
          key: racer-desktop-bundle-${{ matrix.os }}-${{ hashFiles('tools/racer_app/desktop/src-tauri/Cargo.lock') }}

      - name: Install web and desktop dependencies from the lockfiles
        run: |
          npm ci --prefix tools/racer_app/web
          npm ci --prefix tools/racer_app/desktop

      - name: Build the bundles (the web UI is built by Tauri's beforeBuildCommand)
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: tools/racer_app/desktop
        env:
          NO_STRIP: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            tools/racer_app/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            tools/racer_app/desktop/src-tauri/target/release/bundle/msi/*.msi
            tools/racer_app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            tools/racer_app/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            tools/racer_app/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
