# vehicle_params.yaml -- single source of physical truth (claude-docs/06-vehicle-params.md).
#
# PROVISIONAL FILE: no hardware exists yet and no sysid session has run (roadmap Phase 3 is
# not started). Every numeric value that is filled in below is copied, not invented, from the
# f1tenth_gym default vehicle parameters at:
#
#   https://github.com/f1tenth/f1tenth_gym  (v1.0.0 branch)
#   commit 5a301bd0ae1ceaf7dec653e7549c8d099db58a6b
#   f1tenth_gym/envs/f110_env.py, F110Env.default_config()["params"]
#
# which is also the exact commit this repo's docker/sim-cpu and docker/train-cuda images pin
# f1tenth_gym to (see docker/sim-cpu/pyproject.toml). That default dict is:
#
#   mu=1.0489, C_Sf=4.718, C_Sr=5.4562, lf=0.15875, lr=0.17145, h=0.074, m=3.74, I=0.04712,
#   s_min=-0.4189, s_max=0.4189, sv_min=-3.2, sv_max=3.2, v_switch=7.319, a_max=9.51,
#   v_min=-5.0, v_max=20.0, width=0.31, length=0.58
#
# Fields with no analogue in that dict (drivetrain electrical constants, tire Pacejka fit,
# wheel radius, servo dynamics, sensor extrinsics, TTC/envelope tuning) are genuinely unknown
# until Phase 1-3 hardware work; the schema permits `null` for those and every one is
# commented below with what unblocks it. This file validates strictly against
# config/vehicle_params.schema.json (additionalProperties: false, required keys enforced) --
# nothing here is a silently-missing key.
#
# meta.sysid_session_id = "none-preliminary" flags that this is NOT a fitted result.
#
# schema_version bumped 0.1.0 -> 0.2.0 for milestone 4 (hardware-arrival prep, roadmap task
# 1.3): added steering.pwm_{min,max,neutral}_us, actuation.throttle_pwm_{min,max,neutral}_us,
# and limits.mux_watchdog_timeout_s / mux_kill_switch_threshold_us -- the layer-1 safety mux
# firmware's (firmware/safety_mux/) physical constants. Per claude-docs/06-vehicle-params.md
# rule 5, this bumps schema_version because it changes the schema's required-field set;
# consumers must refuse on mismatch either way.
#
# schema_version bumped 0.2.0 -> 0.2.1 on 2026-09-12: those nine safety-mux fields were filled
# in with PROVISIONAL values so firmware/safety_mux can arm for a first bench test. No schema
# field was added or removed (hence a patch bump, not a minor one), but the VALUES changed and
# rule 5 bumps on any change.
#
#   !! THE NINE SAFETY-MUX VALUES BELOW ARE NOT MEASURED. !!
#
# They are the standard hobby-RC servo/ESC convention (1000/1500/2000 us) plus two
# conservative starting points, written down so the firmware stops refusing to arm -- NOT
# because anyone put a scope on this car's receiver, servo, or ESC. Every one is marked
# PROVISIONAL inline below. They MUST be replaced by bench measurement before the car drives
# on the floor: docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3), the
# "Bench-measure and fill in config/vehicle_params.yaml's ... fields the mux firmware needs"
# step. The params are baked into the firmware at compile time, so rebuild and reflash after
# measuring.
#
# schema_version bumped 0.2.1 -> 0.2.2 on 2026-09-13: added actuation.throttle_full_scale_mps
# (a new schema field, filled in PROVISIONAL at 5.0 m/s) and filled in limits.ttc_warning_s /
# limits.ttc_brake_s, which had been null. GitHub issues #40 and #36. Rule 5 bumps on any
# change; consumers refuse on mismatch either way.
#
#   !! THOSE THREE VALUES ARE ALSO NOT MEASURED AND NOT TUNED. !!
#
# Each is marked PROVISIONAL inline below with what replaces it and when.
#
# schema_version bumped 0.2.2 -> 0.3.0 on 2026-09-21: steering.pwm_min_us / pwm_max_us /
# pwm_neutral_us replaced with values MEASURED on the car that evening (wheels off the
# ground, mux armed, commanded via the Jetson PWM), and a new required field,
# steering.pwm_left_bound, was added to carry the sign convention that measurement also
# found: a SHORTER pulse turns the wheels LEFT, the opposite of what the mapping had been
# assuming. That sign used to live as an unmeasured node parameter default
# (racer_drivers/pwm_output_node's steering_left_is_pwm_max, true) rather than here --
# CLAUDE.md invariant 2 treats a sign convention as a physical constant, not a code/launch
# default, so it moved into this file once it was actually measured. A new required field
# changes the schema's required-field set, so this is a minor bump per rule 5; throttle
# fields are UNCHANGED by this bump. See docs/notes/bench-session-2026-09-20.md's steering
# endpoint follow-up and docs/notes/build-log.md's 2026-09-21 evening entry.

chassis:
  mass_kg: 3.74                    # gym: m
  wheelbase_m: 0.3302              # gym: lf + lr = 0.15875 + 0.17145
  cg_to_front_axle_m: 0.15875      # gym: lf
  cg_to_rear_axle_m: 0.17145       # gym: lr
  track_width_m: null              # not modeled by the gym single-track model; needs Phase 1 chassis measurement
  cg_height_m: 0.074               # gym: h
  yaw_inertia_kg_m2: 0.04712       # gym: I
  length_m: 0.58                   # gym: length (bounding box)
  width_m: 0.31                    # gym: width (bounding box)

tires:
  surface_friction_coefficient: 1.0489               # gym: mu
  linear_cornering_stiffness_front_n_per_rad: 4.718   # gym: C_Sf (placeholder for a full Pacejka fit)
  linear_cornering_stiffness_rear_n_per_rad: 5.4562   # gym: C_Sr (placeholder for a full Pacejka fit)
  pacejka_front: null               # needs Phase 3 sysid (constant-radius sweeps, see 07-sim-and-sysid.md)
  pacejka_rear: null                # needs Phase 3 sysid
  nominal_radius_m: null            # MEASURED + drift-tracked value; needs Phase 1 wheel measurement
  compound_id: "unknown-pending-phase3-tire-spec"
  surface_id: "unknown-pending-venue-survey"
  kinematic_dynamic_switch_velocity_mps: 7.319        # gym: v_switch

drivetrain:
  gear_ratio: null                  # needs Phase 1 drivetrain assembly
  pole_pairs: null                  # needs motor spec/measurement
  motor_kv_rad_per_s_per_v: null    # needs motor spec, converted to SI at the driver boundary (CLAUDE.md invariant 4)
  current_limit_a: null             # mirrors VESC layer-2 config, which does not exist yet
  brake_current_limit_a: null       # mirrors VESC layer-2 config, which does not exist yet

steering:
  min_angle_rad: -0.4189            # gym: s_min
  max_angle_rad: 0.4189             # gym: s_max
  min_rate_rad_per_s: -3.2          # gym: sv_min
  max_rate_rad_per_s: 3.2           # gym: sv_max
  time_constant_s: null             # needs Phase 2/3 measurement
  pwm_to_angle_table: null          # STILL ASSUMED LINEAR between pwm_min_us/pwm_max_us and the
                                     # corresponding angle limits -- a measured table is a later
                                     # task (roadmap), not this one. Only the two endpoints and
                                     # neutral below are measured so far.
  # MEASURED 2026-09-21 evening, on the car, wheels off the ground, mux armed, commanded via
  # the Jetson PWM (docs/notes/bench-session-2026-09-20.md's steering endpoint follow-up,
  # docs/notes/build-log.md's 2026-09-21 evening entry). Method: sweep the commanded pulse
  # width and watch the front wheels against their mechanical stops.
  #
  # QUANTISATION CAVEAT: the Jetson PWM only produces 78.125 us grid steps, so these are the
  # nearest achievable grid values, not continuous measurements. Left stop: 1093.75 us
  # commanded was clean, 1015.6 us made the servo hum against the stop. Right stop: 1875 us
  # commanded was clean, 1953 us hummed.
  pwm_min_us: 1094.0                 # MEASURED 2026-09-21: left mechanical stop (see pwm_left_bound)
  pwm_max_us: 1875.0                 # MEASURED 2026-09-21: right mechanical stop
  pwm_neutral_us: 1500.0             # MEASURED 2026-09-21: commanded 1500us puts the wheels
                                     # straight ahead (mux reports actual 1484us, quantisation --
                                     # see docs/notes/first-boot-runbook.md "Reading the mux numbers")
  # SIGN, MEASURED 2026-09-21 at the mux: a SHORTER pulse turns the wheels LEFT. The mapping
  # had been sending positive steering_angle (LEFT positive, claude-docs/06-vehicle-params.md)
  # to a LONGER pulse -- confirmed backwards at the mux (steering_angle 0.2 rad gave 1719 us,
  # above neutral, before this fix). pwm_left_bound flips this in configuration, not in
  # hand-edited code (CLAUDE.md invariant 2: a sign convention is a physical constant).
  pwm_left_bound: "pwm_min_us"       # MEASURED 2026-09-21: pwm_min_us (the shorter pulse) is full LEFT

actuation:
  command_to_torque_delay_s: null   # needs Phase 2/3 measurement
  throttle_time_constant_s: null    # needs Phase 2/3 measurement
  max_acceleration_mps2: 9.51       # gym: a_max
  # The three fields below are firmware/safety_mux's throttle/ESC-channel bounds. All three
  # are PROVISIONAL, standard RC convention, NOT measured:
  # 1000/1500/2000 us is the standard hobby-RC ESC pulse convention, and 1500 us is assumed
  # (not confirmed) to be this ESC's zero-throttle point. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3). An ESC whose real
  # neutral is not 1500 us would be commanded to creep in the cut state, which is exactly why
  # this cannot stay provisional past the bench.
  throttle_pwm_min_us: 1000.0       # PROVISIONAL (standard RC convention, NOT measured) -- see above
  throttle_pwm_max_us: 2000.0       # PROVISIONAL (standard RC convention, NOT measured) -- see above
  throttle_pwm_neutral_us: 1500.0   # PROVISIONAL (standard RC convention, NOT measured) -- see above
  # Full-scale speed reference for racer_drivers/pwm_output_node's OPEN-LOOP throttle map: a
  # commanded +this maps to throttle_pwm_max_us, -this to throttle_pwm_min_us. It exists
  # because that map needs a speed-to-pulse scale and the only number previously available was
  # limits.global_speed_cap_mps (20.0 m/s), which is an f1tenth_gym model-validity bound and
  # not an actuation scale: against it a 1 m/s command is 25 us off neutral, likely inside the
  # VESC's PPM deadband, so a gentle first-boot teleop command would produce no motion at all
  # (GitHub issue #40). This field is ONLY the throttle map's full scale. It is not a safety
  # limit and it does not replace limits.global_speed_cap_mps, which still clamps the command.
  #
  # PROVISIONAL, NOT MEASURED: 5.0 m/s is a plausible full-scale speed for a 1/10 car, picked
  # so 1 m/s lands 100 us off neutral, clear of any sane PPM deadband. Nobody has measured
  # what speed this car actually reaches at throttle_pwm_max_us, and in PPM the pulse commands
  # duty or current rather than speed, so this is a scale factor and not a promise. It goes
  # away entirely when the closed-loop VESC driver (claude-docs/04-architecture.md's
  # vesc_node) replaces the open-loop map. Until then it is replaced by bench measurement at
  # docs/notes/first-boot-runbook.md's wheels-off-the-ground throttle step: sweep the
  # commanded speed, record wheel speed against pulse width, and set this to the speed
  # observed at throttle_pwm_max_us.
  throttle_full_scale_mps: 5.0      # PROVISIONAL (unmeasured open-loop map scale) -- see above

sensors:
  imu:
    mount_x_m: null                 # designed to mount at the CG; exact offset needs Phase 2 ingest-board measurement
    mount_y_m: null
    mount_z_m: null
    mount_yaw_rad: null
    timestamp_offset_s: null        # needs the sync design doc (roadmap 2.2)
  lidar:
    mount_x_m: null                 # needs Phase 2 mounting (roadmap 2.3)
    mount_y_m: null
    mount_z_m: null
    mount_yaw_rad: null
    timestamp_offset_s: null        # needs the sync design doc (roadmap 2.2)

limits:
  global_speed_cap_mps: 20.0        # gym: v_max -- a dynamics-model validity bound, NOT a validated safety cap; must be
                                     # lowered before any Phase 1 bench/track session
  min_velocity_mps: -5.0            # gym: v_min
  # TTC gate thresholds, read by racer_safety/safety_node (claude-docs/05-safety.md layer 3).
  # Both were null, which made the TTC gate a documented no-op: the moment a LiDAR is fitted
  # and /scan starts arriving, no obstacle however close would have braked the car (GitHub
  # issue #36).
  #
  # PROVISIONAL, NOT TUNED: 0.5 s to brake and 1.0 s to warn are the conventional
  # F1TENTH-class starting points, the same pair this repo's L3 TTC test had been passing as
  # an override since the gate was written. They are NOT derived from this car's braking
  # distance, which nobody has measured. They are here so the gate is ARMED rather than inert
  # on the first drive with a scan. Replace with tuned values from Phase 1/2 braking-distance
  # data (roadmap phase 1/2, claude-docs/05-safety.md).
  #
  # KNOWN LIMITATION of the TTC estimate itself, separate from these numbers: safety_node has
  # no /odom, so the forward speed it divides range by is its OWN COMMANDED speed, not a
  # measured one. Slower-than-commanded means TTC is under-estimated (brakes early, the safe
  # direction); coasting faster than commanded means it is over-estimated. That stands until
  # /odom exists.
  ttc_warning_s: 1.0                # PROVISIONAL (conventional starting point, NOT tuned) -- see above
  ttc_brake_s: 0.5                  # PROVISIONAL (conventional starting point, NOT tuned) -- see above
  envelope_fraction_speed: null     # needs Phase 5 tuning (claude-docs/08-learning.md)
  envelope_fraction_lateral_accel: null  # needs Phase 5 tuning (claude-docs/08-learning.md)
  # PROVISIONAL, NOT measured or tuned: 100 ms is roughly five missed frames of a 50 Hz
  # heartbeat, a conservative starting point chosen so the firmware can arm on the bench. The
  # real value comes from the kill-test timing budget. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3).
  mux_watchdog_timeout_s: 0.1       # PROVISIONAL (conservative starting point, NOT tuned) -- see above
  # PROVISIONAL, NOT measured: the midpoint of the standard 1000-2000 us RC range. A
  # two-position kill switch reads near 1000 us or near 2000 us, so any threshold between them
  # separates them -- but this receiver/transmitter pair's actual endpoints are unverified, and
  # so is which end is ARMED. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3).
  mux_kill_switch_threshold_us: 1500.0  # PROVISIONAL (range midpoint, NOT measured) -- see above

meta:
  # PROVISIONAL VALUES STILL PRESENT: the six firmware/safety_mux throttle-channel PWM
  # fields, plus actuation.throttle_full_scale_mps and the two limits.ttc_*_s thresholds
  # added or filled in on 2026-09-13, are placeholders, NOT measured, NOT fitted (see the
  # header block and each field's inline comment). The three steering.pwm_*_us fields and
  # steering.pwm_left_bound are the exception as of 2026-09-21: they ARE measured (see the
  # steering section above). sysid_session_id stays "none-preliminary" -- there is still
  # no on-vehicle fit of any kind, and this file is less fitted than that name implies, not
  # more. (meta is additionalProperties:false in config/vehicle_params.schema.json, so this
  # note lives as a comment rather than a tenth meta key.)
  schema_version: "0.3.0"
  sysid_session_id: "none-preliminary"
  fit_date: "2026-08-22"            # date this preliminary, gym-sourced file was assembled -- not a sysid fit date
