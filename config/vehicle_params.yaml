# vehicle_params.yaml -- single source of physical truth (claude-docs/06-vehicle-params.md).
#
# PROVISIONAL FILE: no hardware exists yet and no sysid session has run (roadmap Phase 3 is
# not started). Every numeric value that is filled in below is copied, not invented, from the
# f1tenth_gym default vehicle parameters at:
#
#   https://github.com/f1tenth/f1tenth_gym  (v1.0.0 branch)
#   commit 5a301bd0ae1ceaf7dec653e7549c8d099db58a6b
#   f1tenth_gym/envs/f110_env.py, F110Env.default_config()["params"]
#
# which is also the exact commit this repo's docker/sim-cpu and docker/train-cuda images pin
# f1tenth_gym to (see docker/sim-cpu/pyproject.toml). That default dict is:
#
#   mu=1.0489, C_Sf=4.718, C_Sr=5.4562, lf=0.15875, lr=0.17145, h=0.074, m=3.74, I=0.04712,
#   s_min=-0.4189, s_max=0.4189, sv_min=-3.2, sv_max=3.2, v_switch=7.319, a_max=9.51,
#   v_min=-5.0, v_max=20.0, width=0.31, length=0.58
#
# Fields with no analogue in that dict (drivetrain electrical constants, tire Pacejka fit,
# wheel radius, servo dynamics, sensor extrinsics, TTC/envelope tuning) are genuinely unknown
# until Phase 1-3 hardware work; the schema permits `null` for those and every one is
# commented below with what unblocks it. This file validates strictly against
# config/vehicle_params.schema.json (additionalProperties: false, required keys enforced) --
# nothing here is a silently-missing key.
#
# meta.sysid_session_id = "none-preliminary" flags that this is NOT a fitted result.
#
# schema_version bumped 0.1.0 -> 0.2.0 for milestone 4 (hardware-arrival prep, roadmap task
# 1.3): added steering.pwm_{min,max,neutral}_us, actuation.throttle_pwm_{min,max,neutral}_us,
# and limits.mux_watchdog_timeout_s / mux_kill_switch_threshold_us -- the layer-1 safety mux
# firmware's (firmware/safety_mux/) physical constants. Per claude-docs/06-vehicle-params.md
# rule 5, this bumps schema_version because it changes the schema's required-field set;
# consumers must refuse on mismatch either way.
#
# schema_version bumped 0.2.0 -> 0.2.1 on 2026-09-12: those nine safety-mux fields were filled
# in with PROVISIONAL values so firmware/safety_mux can arm for a first bench test. No schema
# field was added or removed (hence a minor bump (new required field), not a minor one), but the VALUES changed and
# rule 5 bumps on any change.
#
#   !! THE NINE SAFETY-MUX VALUES BELOW ARE NOT MEASURED. !!
#
# They are the standard hobby-RC servo/ESC convention (1000/1500/2000 us) plus two
# conservative starting points, written down so the firmware stops refusing to arm -- NOT
# because anyone put a scope on this car's receiver, servo, or ESC. Every one is marked
# PROVISIONAL inline below. They MUST be replaced by bench measurement before the car drives
# on the floor: docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3), the
# "Bench-measure and fill in config/vehicle_params.yaml's ... fields the mux firmware needs"
# step. The params are baked into the firmware at compile time, so rebuild and reflash after
# measuring.
#
# schema_version bumped 0.2.1 -> 0.2.2 on 2026-09-13: added actuation.throttle_full_scale_mps
# (a new schema field, filled in PROVISIONAL at 5.0 m/s) and filled in limits.ttc_warning_s /
# limits.ttc_brake_s, which had been null. GitHub issues #40 and #36. Rule 5 bumps on any
# change; consumers refuse on mismatch either way.
#
#   !! THOSE THREE VALUES ARE ALSO NOT MEASURED AND NOT TUNED. !!
#
# Each is marked PROVISIONAL inline below with what replaces it and when.
#
# schema_version bumped 0.2.2 -> 0.3.0 on 2026-09-21: steering.pwm_min_us / pwm_max_us /
# pwm_neutral_us replaced with values MEASURED on the car that evening (wheels off the
# ground, mux armed, commanded via the Jetson PWM), and a new required field,
# steering.pwm_left_bound, was added to carry the sign convention that measurement also
# found: a SHORTER pulse turns the wheels LEFT, the opposite of what the mapping had been
# assuming. That sign used to live as an unmeasured node parameter default
# (racer_drivers/pwm_output_node's steering_left_is_pwm_max, true) rather than here --
# CLAUDE.md invariant 2 treats a sign convention as a physical constant, not a code/launch
# default, so it moved into this file once it was actually measured. A new required field
# changes the schema's required-field set, so this is a minor bump per rule 5; throttle
# fields are UNCHANGED by this bump. See docs/notes/bench-session-2026-09-20.md's steering
# endpoint follow-up and docs/notes/build-log.md's 2026-09-21 evening entry.
#
# schema_version bumped 0.3.0 -> 0.4.0 on 2026-09-21: two new REQUIRED fields,
# actuation.steering_pwm_period_us and actuation.throttle_pwm_period_us, carry the Jetson PWM
# frame period that until now was a hand-written 20 ms in racer_drivers/pwm_output_node
# (GitHub issue #66). The frame period decides the achievable pulse grid -- period/256 on the
# Tegra controller's 8-bit duty -- so it is a driver-boundary physical constant and belongs
# here rather than in a node default (CLAUDE.md invariant 2). Both are set to 4000 us, which
# takes the grid from 78.125 us to 15.625 us; nothing downstream of the mux changes, because
# the mux regenerates its own 50 Hz outputs. A new required field changes the schema's
# required-field set, so this is a minor bump per rule 5. No other field changed. See the
# actuation section below and docs/notes/build-log.md's 2026-09-21 entry for issue #66.
#
# schema_version bumped 0.4.0 -> 0.4.1 on 2026-09-27: drivetrain.gear_ratio, .pole_pairs,
# .motor_kv_rad_per_s_per_v, .current_limit_a, and .brake_current_limit_a were filled in below
# (values from the vendor-supplied Hobbywing Xerun G3 spec sheet and the committed VESC
# config, planning-docs/06-vesc-config-and-jetson-bringup.md step 6), along with
# tires.nominal_radius_m. No schema field was added or removed -- these six keys were already
# present and nullable -- but per claude-docs/06-vehicle-params.md rule 5 ("Any change bumps
# schema_version") and this file's own precedent (0.2.0 -> 0.2.1 on 2026-09-12, a value-only
# fill of provisional fields with no key added/removed), a patch bump is required here too.
# Consumers refuse on mismatch either way. See docs/notes/build-log.md's 2026-09-27 entry.
#
# schema_version bumped 0.5.0 -> 0.5.1 on 2026-09-29: actuation.throttle_deadband_us 50 -> 20,
# a value-only change (no key added/removed), patch bump per rule 5. See the field's comment.
#
# schema_version bumped 0.4.1 -> 0.5.0 on 2026-09-29: three new REQUIRED actuation fields.
# actuation.steering_pwm_achieved_period_us and actuation.throttle_pwm_achieved_period_us
# carry the frame period the Jetson's PWM channels ACTUALLY emit when 4000 us is requested,
# measured at the mux (GitHub issue #77: every pulse was about 1.7 percent short, commanded
# 1500 read 1475), so racer_drivers/pwm_output_node can pre-scale each duty and put the
# commanded pulse width on the wire. actuation.throttle_deadband_us makes the open-loop
# throttle map jump past the VESC's PPM deadband on the first non-zero command, so speed 0 is
# exactly neutral and the first keyboard tap turns the wheels. New required fields change the
# schema's required-field set, so this is a minor bump per rule 5. No existing value changed.
# See the actuation section below and docs/notes/build-log.md's 2026-09-29 entry for #77.
#
# schema_version bumped 0.6.0 -> 0.6.1 on 2026-10-06: the four sensors.lidar mount fields went
# from PROVISIONAL placeholders to MEASURED values from the first LiDAR bench run (roadmap 2.3,
# docs/notes/build-log.md 2026-10-06). No field added or removed, so a patch bump; rule 5 bumps
# on any value change. mount_yaw_rad is pi: a box held straight ahead of the car read at a
# laser bearing of 177 deg and a box on the driver's left read at -100 deg, so laser bearing
# + pi gives the vehicle bearing with LEFT positive and no mirroring.
#
# schema_version bumped 0.9.0 -> 0.9.1 on 2026-10-06: limits.ttc_forward_sector_half_angle_rad
# 0.6 -> 1.2. With the corridor gate the sector is only an outer bound, and at 0.6 rad it hid
# anything inside about 0.30 m of the head that sat near a front corner (the corridor half
# width 0.205 m over tan 0.6). At 1.2 rad the corridor is fully covered out past 0.08 m. Value
# change only: patch bump per rule 5.
#
# schema_version bumped 0.8.0 -> 0.9.0 on 2026-10-06 (night, first floor test): one new
# REQUIRED field, limits.obstacle_corridor_margin_m (PROVISIONAL 0.05 m). On a tight track of
# backpacks about 1 m wide with gap_follow_node at 0.8 to 1.0 m/s, racer_safety's obstacle gate
# took its minimum range over the whole +/- 0.6 rad wedge ahead of the car, so a bag 0.3 m to
# the side of the car's path, which the car passes cleanly, tripped the TTC brake (0.35 s) and
# the clearance floor (0.20 m) exactly like a bag straight ahead, and the owner found the
# safety node far too aggressive on that track. The gate now counts a return only if it lies in
# a straight corridor ahead of the car, |y| <= chassis.width_m / 2 + this margin (0.155 + 0.05
# = 0.205 m), and uses the along-track distance x, not the slant range, for TTC and the floor.
# ttc_forward_sector_half_angle_rad stays at 0.6 as an outer bound only (nothing outside it is
# ever considered, whatever the margin). With these values the sector, not the corridor, limits
# what is seen closer than about 0.30 m from the head (0.205 / tan 0.6), so a return right at a
# front corner that close is still outside the test; see racer_safety/forward_sector.hpp. A new
# required field changes the schema's required-field set, so this is a minor bump per rule 5.
# No existing value changed. Consumers refuse on mismatch either way.
#
# schema_version bumped 0.7.2 -> 0.8.0 on 2026-10-06 (late, third bench pass, wheels off the
# ground with gap_follow_node): limits.ttc_warning_s 0.6 -> 0.45 (it is the latch's release
# line) and limits.ttc_forward_sector_half_angle_rad 1.0 -> 0.6. On the stand, a person beside
# the front corner sat inside the 1.0 rad sector and held the latch, and the 0.6 s release at a
# 1.0 m/s request needed 0.6 m of clear road. ttc_brake_s 0.35 and min_forward_clearance_m 0.20
# are unchanged. Plus one new REQUIRED field, limits.obstacle_steering_hold_after_s
# (PROVISIONAL 0.5 s): once the obstacle latch has held the output speed at zero that long,
# racer_safety freezes the steering output until the latch releases, so a car parked against an
# obstacle stops hunting its servo (the owner watched it do that on the stand). A new required
# field changes the schema's required-field set, so this is a minor bump per rule 5, the same
# as 0.6.1 -> 0.7.0. Consumers refuse on mismatch either
# way. All three values are PROVISIONAL.
#
# schema_version bumped 0.7.1 -> 0.7.2 on 2026-10-06 (second bench pass): ttc_brake_s 0.5 -> 0.35,
# ttc_warning_s 0.8 -> 0.6, min_forward_clearance_m 0.25 -> 0.20. With gap_follow_node at
# 0.8 to 1.0 m/s on the stand the latch engaged whenever a person came within about half a
# metre and could not release near a wall, because release needs the whole forward sector past
# both the clearance floor times 1.5 and the warning TTC at the requested speed. Owner wants a
# last-second brake. Value change only: patch bump per rule 5. Still PROVISIONAL: these are the
# first floor-run candidates, not tuned numbers.
#
# schema_version bumped 0.7.0 -> 0.7.1 on 2026-10-06 (evening): limits.ttc_brake_s 1.0 -> 0.5,
# ttc_warning_s 2.0 -> 0.8, min_forward_clearance_m 0.30 -> 0.25 after the wheels-off-ground
# retest with the latched obstacle gate (PR 91). With the latch the chatter is gone, and the
# owner found the 1.0 s / 2.0 s pair too early at the 0.5 m/s bench cap (brake at 0.50 m,
# release only past 1.0 m). The warning threshold doubles as the release line, so 0.8 s
# releases at 0.40 m and 0.5 s brakes at 0.25 m at that speed. Value change only: patch bump
# per rule 5. Still PROVISIONAL: re-tune on the floor at real speed, where 0.5 s at 2 m/s is 1 m.
#
# schema_version bumped 0.6.1 -> 0.7.0 on 2026-10-06: two new REQUIRED limits fields for
# racer_safety's obstacle gate, limits.min_forward_clearance_m (PROVISIONAL 0.30 m, a distance
# floor that zeroes forward throttle regardless of speed) and
# limits.ttc_forward_sector_half_angle_rad (PROVISIONAL 1.0 rad, the forward sector the TTC
# gate and the floor look at, instead of the whole 360 degree scan). New required fields change
# the schema's required-field set, so this is a minor bump per rule 5. limits.ttc_brake_s
# 0.5 -> 1.0 and limits.ttc_warning_s 1.0 -> 2.0 in the same change (still PROVISIONAL). Why:
# the 2026-10-06 wheels-off bench run, where 0.5 s at crawl speed was 25 cm and the TTC brake
# and the gate's own rate limiter fought each other in a 17 Hz brake/release limit cycle. See
# docs/notes/ttc-limit-cycle-2026-10-06.md and the limits section below.
#
# schema_version bumped 0.5.1 -> 0.6.0 on 2026-10-05 (roadmap 2.3, RPLIDAR C1): a new
# REQUIRED section, sensors.lidar_spec, carries the LiDAR head's datasheet numbers (scan rate,
# sample rate, resolution, field of view, range) that racer_tools' lidar_check compares a live
# /scan against and that racer_bringup/launch/lidar.launch.py hands the driver. A new required
# section changes the schema's required-field set, so this is a minor bump per rule 5. The
# four sensors.lidar mount fields went from null to PROVISIONAL placeholders in the same
# change so the base_link -> laser transform can be published at all; they are NOT measured.
# See the sensors section below and docs/notes/build-log.md's 2026-10-05 entry.

chassis:
  mass_kg: 3.74                    # gym: m
  wheelbase_m: 0.3302              # gym: lf + lr = 0.15875 + 0.17145
  cg_to_front_axle_m: 0.15875      # gym: lf
  cg_to_rear_axle_m: 0.17145       # gym: lr
  track_width_m: null              # not modeled by the gym single-track model; needs Phase 1 chassis measurement
  cg_height_m: 0.074               # gym: h
  yaw_inertia_kg_m2: 0.04712       # gym: I
  length_m: 0.58                   # gym: length (bounding box)
  width_m: 0.31                    # gym: width (bounding box)

tires:
  surface_friction_coefficient: 1.0489               # gym: mu
  linear_cornering_stiffness_front_n_per_rad: 4.718   # gym: C_Sf (placeholder for a full Pacejka fit)
  linear_cornering_stiffness_rear_n_per_rad: 5.4562   # gym: C_Sr (placeholder for a full Pacejka fit)
  pacejka_front: null               # needs Phase 3 sysid (constant-radius sweeps, see 07-sim-and-sysid.md)
  pacejka_rear: null                # needs Phase 3 sysid
  nominal_radius_m: 0.1095          # PROVISIONAL, ASSUMED (not measured): 4.31 in tires per
                                     # Traxxas published Slash 4x4 VXL specs, source: vendor-
                                     # supplied Hobbywing G3 spec table, 2026-09-27. This field's
                                     # description calls for a MEASURED, drift-tracked value
                                     # (tires wear) -- this is not that yet; replace with a Phase 1
                                     # wheel measurement per sysid/drift/ before treating it as fitted.
  compound_id: "unknown-pending-phase3-tire-spec"
  surface_id: "unknown-pending-venue-survey"
  kinematic_dynamic_switch_velocity_mps: 7.319        # gym: v_switch

drivetrain:
  # Hobbywing Xerun 3652SD-4500KV-G3 (HW30401064). Source: vendor-supplied Hobbywing G3 spec
  # table, 2026-09-27. 4 poles -> 2 pole pairs (poles / 2).
  gear_ratio: 11.82                 # PROVISIONAL, ASSUMED (not measured): stock Traxxas Slash 4x4
                                     # overall drive ratio per Traxxas published VXL specs, source:
                                     # vendor-supplied Hobbywing G3 spec table, 2026-09-27. Not
                                     # confirmed against this car's actual spur/pinion count; needs
                                     # Phase 1 drivetrain assembly measurement to un-provisional.
  pole_pairs: 2                     # source: vendor-supplied Hobbywing G3 spec table, 2026-09-27
                                     # (4 poles / 2 = 2 pole pairs, Hobbywing Xerun 3652SD-4500KV-G3)
  motor_kv_rad_per_s_per_v: 471.2389  # source: vendor-supplied Hobbywing G3 spec table, 2026-09-27.
                                     # Datasheet Kv 4500 RPM/V, converted to SI at this boundary
                                     # (CLAUDE.md invariant 4): 4500 * 2*pi/60 = 471.2389 rad/s/V.
  current_limit_a: 30               # source: config/vesc/2026-09-21b-fsesc67-motor.xml l_current_max
                                     # (30 A), mirrored per planning-docs/06-vesc-config-and-jetson-
                                     # bringup.md step 6.
  brake_current_limit_a: 15         # source: config/vesc/2026-09-21b-fsesc67-motor.xml l_current_min
                                     # magnitude (-15 A), mirrored per planning-docs/06-vesc-config-
                                     # and-jetson-bringup.md step 6.
  # CONSTRAINT, not a schema field (no home for it in this section): the 3652SD family is rated
  # by Hobbywing for 2S LiPo only (the 3660 models are rated 2-3S); this car runs a 3S pack.
  # Safe operation on 3S depends entirely on the committed VESC limits above staying where they
  # are: l_max_erpm capped at 6000 (config/vesc/2026-09-21b-fsesc67-motor.xml), l_current_max
  # 30 A, and the motor temperature limit at 85 C (l_temp_motor_start). The l_max_erpm cap must
  # NEVER be raised while this motor runs on 3S. Motor temperature monitoring is not yet
  # possible -- the hall/temp sensor cable is not fitted -- so l_temp_motor_start/end are
  # currently unenforceable in practice; treat that as an open safety item until the cable is
  # fitted. Source: vendor-supplied Hobbywing G3 spec table, 2026-09-27; see
  # docs/notes/build-log.md's 2026-09-27 entry.
  #
  # VESC-DETECTED electrical constants (sensorless FOC, 2026-09-21): phase resistance R
  # 6.60 mOhm, phase inductance L 1.88 uH, flux linkage 0.25 mWb
  # (config/vesc/2026-09-21b-fsesc67-motor.xml foc_motor_r/foc_motor_l/foc_motor_flux_linkage).
  # No field in this schema section holds them; per the task that produced this entry they are
  # not being added as a new section, and are recorded instead in docs/notes/build-log.md's
  # 2026-09-27 entry.

steering:
  min_angle_rad: -0.4189            # gym: s_min
  max_angle_rad: 0.4189             # gym: s_max
  min_rate_rad_per_s: -3.2          # gym: sv_min
  max_rate_rad_per_s: 3.2           # gym: sv_max
  time_constant_s: null             # needs Phase 2/3 measurement
  pwm_to_angle_table: null          # STILL ASSUMED LINEAR between pwm_min_us/pwm_max_us and the
                                     # corresponding angle limits -- a measured table is a later
                                     # task (roadmap), not this one. Only the two endpoints and
                                     # neutral below are measured so far.
  # MEASURED 2026-09-21 evening, on the car, wheels off the ground, mux armed, commanded via
  # the Jetson PWM (docs/notes/bench-session-2026-09-20.md's steering endpoint follow-up,
  # docs/notes/build-log.md's 2026-09-21 evening entry). Method: sweep the commanded pulse
  # width and watch the front wheels against their mechanical stops.
  #
  # QUANTISATION CAVEAT: the Jetson PWM only produces 78.125 us grid steps, so these are the
  # nearest achievable grid values, not continuous measurements. Left stop: 1093.75 us
  # commanded was clean, 1015.6 us made the servo hum against the stop. Right stop: 1875 us
  # commanded was clean, 1953 us hummed.
  pwm_min_us: 1094.0                 # MEASURED 2026-09-21: left mechanical stop (see pwm_left_bound)
  pwm_max_us: 1875.0                 # MEASURED 2026-09-21: right mechanical stop
  pwm_neutral_us: 1500.0             # MEASURED 2026-09-21: commanded 1500us puts the wheels
                                     # straight ahead (mux reports actual 1484us, quantisation --
                                     # see docs/notes/first-boot-runbook.md "Reading the mux numbers")
  # SIGN, MEASURED 2026-09-21 at the mux: a SHORTER pulse turns the wheels LEFT. The mapping
  # had been sending positive steering_angle (LEFT positive, claude-docs/06-vehicle-params.md)
  # to a LONGER pulse -- confirmed backwards at the mux (steering_angle 0.2 rad gave 1719 us,
  # above neutral, before this fix). pwm_left_bound flips this in configuration, not in
  # hand-edited code (CLAUDE.md invariant 2: a sign convention is a physical constant).
  pwm_left_bound: "pwm_min_us"       # MEASURED 2026-09-21: pwm_min_us (the shorter pulse) is full LEFT

actuation:
  command_to_torque_delay_s: null   # needs Phase 2/3 measurement
  throttle_time_constant_s: null    # needs Phase 2/3 measurement
  max_acceleration_mps2: 9.51       # gym: a_max
  # The three fields below are firmware/safety_mux's throttle/ESC-channel bounds. All three
  # are PROVISIONAL, standard RC convention, NOT measured:
  # 1000/1500/2000 us is the standard hobby-RC ESC pulse convention, and 1500 us is assumed
  # (not confirmed) to be this ESC's zero-throttle point. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3). An ESC whose real
  # neutral is not 1500 us would be commanded to creep in the cut state, which is exactly why
  # this cannot stay provisional past the bench.
  throttle_pwm_min_us: 1000.0       # PROVISIONAL (standard RC convention, NOT measured) -- see above
  throttle_pwm_max_us: 2000.0       # PROVISIONAL (standard RC convention, NOT measured) -- see above
  throttle_pwm_neutral_us: 1500.0   # PROVISIONAL (standard RC convention, NOT measured) -- see above
  # Full-scale speed reference for racer_drivers/pwm_output_node's OPEN-LOOP throttle map: a
  # commanded +this maps to throttle_pwm_max_us, -this to throttle_pwm_min_us. It exists
  # because that map needs a speed-to-pulse scale and the only number previously available was
  # limits.global_speed_cap_mps (20.0 m/s), which is an f1tenth_gym model-validity bound and
  # not an actuation scale: against it a 1 m/s command is 25 us off neutral, likely inside the
  # VESC's PPM deadband, so a gentle first-boot teleop command would produce no motion at all
  # (GitHub issue #40). This field is ONLY the throttle map's full scale. It is not a safety
  # limit and it does not replace limits.global_speed_cap_mps, which still clamps the command.
  #
  # PROVISIONAL, NOT MEASURED: 5.0 m/s is a plausible full-scale speed for a 1/10 car, picked
  # so 1 m/s lands 100 us off neutral, clear of any sane PPM deadband. Nobody has measured
  # what speed this car actually reaches at throttle_pwm_max_us, and in PPM the pulse commands
  # duty or current rather than speed, so this is a scale factor and not a promise. It goes
  # away entirely when the closed-loop VESC driver (claude-docs/04-architecture.md's
  # vesc_node) replaces the open-loop map. Until then it is replaced by bench measurement at
  # docs/notes/first-boot-runbook.md's wheels-off-the-ground throttle step: sweep the
  # commanded speed, record wheel speed against pulse width, and set this to the speed
  # observed at throttle_pwm_max_us.
  throttle_full_scale_mps: 5.0      # PROVISIONAL (unmeasured open-loop map scale) -- see above
  # PWM FRAME PERIOD on the Jetson's two sysfs PWM channels (GitHub issue #66). This is the
  # carrier period racer_drivers/pwm_output_node writes to <channel>/period, in microseconds
  # (the sysfs value is this x 1000, in nanoseconds).
  #
  # WHAT IT ACTUALLY CONTROLS: the achievable pulse-width grid, and nothing else. The Tegra
  # PWM controller has 8-bit duty resolution (pwm-tegra.c, PWM_DUTY_WIDTH 8), so a commanded
  # pulse is quantised to a multiple of period/256. At the 20 ms frame this node used until
  # now that step is 78.125 us: about 13 distinct positions across 1000-2000 us, measured at
  # the mux on 2026-09-21 as commanded 1500 -> 1484, commanded 2000 -> 2031. At 4000 us
  # (250 Hz) the step is 15.625 us, 5x finer, about 64 positions across the same span.
  #
  # WHAT IT DOES NOT CONTROL: what the servo and the ESC see. firmware/safety_mux captures the
  # INPUT pulse width from edge timestamps (pico/pwm_capture.c, time_us_64, 1 us) and
  # REGENERATES its own outputs on GP1/GP3 at a fixed 50 Hz / 20 ms frame (pico/pwm_output.c,
  # top=39999 at 0.5 us per count). The Jetson frame rate therefore exists only on the
  # Jetson-to-Pico link. That is why the steering channel gets 4000 us too: the analog Traxxas
  # 2075 servo never sees it either, so keeping 20 ms there would cost 2.3 deg of steering
  # resolution per step in exchange for nothing.
  #
  # WHY NOT SHORTER: a 2000 us pulse must still fit inside a frame with a clear low gap for
  # the mux's edge capture. At 4000 us full throttle is 50 percent duty with a 2 ms gap; at
  # 2500 us it is 80 percent duty, and a merged pair of frames (two consecutive missed edge
  # interrupts) would start landing inside pwm_capture.c's 200-5000 us plausibility band
  # instead of safely outside it.
  #
  # Both are CONFIGURATION, not measurement: the grid arithmetic is exact, but the Pico-side
  # readings at the new frame are verified on the bench per docs/notes/first-boot-runbook.md
  # "Launch and drive" before the car drives on the floor.
  steering_pwm_period_us: 4000.0    # 250 Hz frame -> 15.625 us pulse grid (issue #66)
  throttle_pwm_period_us: 4000.0    # 250 Hz frame -> 15.625 us pulse grid (issue #66)
  #
  # ACHIEVED FRAME PERIOD (GitHub issue #77). The two fields above are what pwm_output_node
  # REQUESTS; these two are what the hardware EMITS, and on this Jetson at 4000 us they differ.
  #
  # WHY THEY DIFFER, from the driver source (Linux drivers/pwm/pwm-tegra.c,
  # tegra_pwm_config(), the same in v5.15 and v6.12): the duty count is computed against the
  # REQUESTED period, c = round(256 x duty_ns / period_ns), but the frame the controller runs
  # is 256 x (PWM_SCALE + 1) cycles of the PWM clock, where the clock is whatever
  # clk_set_rate() / dev_pm_opp_set_rate() actually settled at for a requested
  # 256 / period and PWM_SCALE is an integer (13-bit) derived from that settled rate. If the
  # clock cannot hit the rate exactly, the frame is not the requested one, and because the
  # duty is a fraction of the frame, EVERY pulse is scaled by achieved / requested.
  #
  # WHY IT IS MEASURED, NOT READ BACK: no kernel interface reports the achieved frame. sysfs
  # <channel>/period and /sys/kernel/debug/pwm both echo the REQUESTED state (pwm-tegra.c has
  # no .get_state callback, so the PWM core only has the cached request to show; sysfs
  # `period` reads back 4000000 on the car). The clock rate it could be computed from is only
  # in debugfs (/sys/kernel/debug/clk/...), which needs root and a debugfs mount the
  # unprivileged car container deliberately does not have. And no requested period can be
  # chosen as "one the clock hits exactly" without reading that clock tree off the device.
  # So the achieved period is a bench measurement, like the steering endpoints.
  #
  # MEASURED 2026-09-29 at the safety mux (DIAG_BUILD), 4000 us requested on both channels,
  # before this compensation existed: commanded 1500 us (duty count 96) read 1475 us on both
  # channels, which alone gives 1475 x 256 / 96 = 3933.3 us; commanded 1652 us (count 106)
  # read 1620 to 1624 us, which gives 3912 to 3922 us. 3925.0 is the least-squares fit of
  # both readings (residuals about -3 us and +3 us). At 20000 us requested there was no such
  # error beyond the 8-bit rounding (1500 read 1484 = 19 x 78.125), so this is specific to the
  # requested period: CHANGING THE REQUESTED PERIOD INVALIDATES THESE TWO VALUES.
  #
  # Verified by docs/notes/first-boot-runbook.md "Bench verification of the frame
  # compensation": commanded 1500 must read 1500 +- 8 us, 1600 must read 1600 +- 8 us. If a
  # reading is off, the runbook gives the formula to re-derive the value from it.
  steering_pwm_achieved_period_us: 3925.0  # MEASURED 2026-09-29 at the mux (issue #77) -- see above
  throttle_pwm_achieved_period_us: 3925.0  # MEASURED 2026-09-29 at the mux (issue #77) -- see above
  #
  # THROTTLE DEADBAND OFFSET. pwm_output_node's open-loop map sends speed 0 to exactly
  # throttle_pwm_neutral_us, and any speed > 0 to neutral + this + a linear share of the rest
  # of the forward range (reaching throttle_pwm_max_us at throttle_full_scale_mps); negative
  # speed mirrors it below neutral. Without it the first ~100 us of throttle (about five
  # keyboard taps) were swallowed by the VESC's PPM deadband and nothing moved.
  #
  # It mirrors the VESC PPM app's deadband (app_ppm_conf.hyst, a fraction of the 500 us half
  # range): 10 percent = 50 us in the 2026-09-29 centred PID Speed Control config, centre
  # 1.4875 ms. The VESC centre sits at 1487.5 us, between the two neutrals the ESC can see
  # (the Jetson's, about 1475 us before issue #77 was fixed, and the mux's own 1500 us on a
  # CUT), and the 50 us deadband swallows both. A tap at 0.25 m/s is then
  # 1500 + 50 + 450 x 0.25 / 5.0 = 1572.5 us, 35 us past the VESC deadband edge (1537.5 us).
  #
  # PROVISIONAL, NOT MEASURED: 20 us is the VESC setting copied across, not a bench
  # measurement of where the wheels start. Provenance: after PR 81's frame compensation is
  # verified at the mux, the VESC PPM app centre returns to 1.500 ms and its input deadband
  # is reduced to 4 percent (20 us of the 500 us half-range). THIS FIELD MUST EQUAL THAT VESC
  # DEADBAND. It was 50 us (10 percent, centre 1.4875 ms) until the VESC change; merge this
  # change only after the VESC has been changed (docs/notes/build-log.md 2026-09-29).
  throttle_deadband_us: 20.0        # PROVISIONAL (mirrors VESC PPM deadband 4 percent) -- see above

sensors:
  imu:
    mount_x_m: null                 # designed to mount at the CG; exact offset needs Phase 2 ingest-board measurement
    mount_y_m: null
    mount_z_m: null
    mount_yaw_rad: null
    timestamp_offset_s: null        # needs the sync design doc (roadmap 2.2)
  # base_link -> laser, published as a static transform by racer_bringup/launch/lidar.launch.py
  # (roadmap 2.3). Flat mount assumed: roll and pitch are zero, there is no field for them.
  #
  #   !! THE FOUR MOUNT VALUES BELOW ARE PROVISIONAL PLACEHOLDERS, NOT MEASURED. !!
  #
  # Written 2026-10-05, the day the RPLIDAR C1 arrived and before it was mounted, for a head
  # centred on the top plate a little ahead of base_link. They exist so lidar.launch.py can
  # publish a transform at all (it refuses while any of them is null). Replace them with tape
  # measurements once the printed mount is on the car, and check the yaw on the bench with an
  # object placed straight ahead of the car: in Foxglove it must appear on +x of base_link
  # (docs/notes/first-boot-runbook.md "LiDAR first power-up"). sllidar_ros2 publishes its scan
  # rotated by pi from the head's own 0 degree mark (sllidar_node.cpp publish_scan: angle =
  # pi - raw angle), so 0.0 here may well turn out to be pi.
  lidar:
    # MEASURED 2026-10-06 on the car with a phone measuring app, about +/- 0.02 m, on the
    # temporary cardboard top plate. base_link origin taken as the rear axle centre at ground
    # level (REP-105 leaves the origin to the project; nothing else in this repo has pinned it
    # yet, so this is the first place that does). Re-measure after the permanent mount.
    mount_x_m: 0.285                # MEASURED 2026-10-06: rear axle centre to head centre, forward
    mount_y_m: 0.0                  # MEASURED 2026-10-06: head on the centreline
    mount_z_m: 0.20                 # MEASURED 2026-10-06: floor to the middle of the scan window
    mount_yaw_rad: 3.141593         # MEASURED 2026-10-06: pi, see the 0.6.1 header note
    timestamp_offset_s: null        # needs the sync design doc (roadmap 2.2)
  # Datasheet numbers for the fitted head, Slamtec RPLIDAR C1 (docs/notes/phase2-parts-2026-09-30.md
  # section A1: 0.05 to 12 m, 5 kHz sample rate, 8 to 12 Hz scan with 10 Hz typical, 0.72
  # degree resolution, 360 degrees). Converted to SI at this boundary (CLAUDE.md invariant 4):
  # 0.72 degree = 0.72 * pi / 180 = 0.012566 rad, 360 degree = 2 pi = 6.283185 rad. These are
  # vendor figures, not measurements; the measured rate goes in a dated docs/notes entry.
  lidar_spec:
    model: "slamtec-rplidar-c1"
    nominal_scan_rate_hz: 10.0      # datasheet: 10 Hz typical
    min_scan_rate_hz: 8.0           # datasheet: 8 to 12 Hz; lidar_check fails below this
    sample_rate_hz: 5000.0          # datasheet: 5 kHz
    angular_resolution_rad: 0.012566  # datasheet: 0.72 degree
    field_of_view_rad: 6.283185     # datasheet: 360 degree
    range_min_m: 0.05               # datasheet: 0.05 m
    range_max_m: 12.0               # datasheet: 12 m

limits:
  global_speed_cap_mps: 20.0        # gym: v_max -- a dynamics-model validity bound, NOT a validated safety cap; must be
                                     # lowered before any Phase 1 bench/track session
  min_velocity_mps: -5.0            # gym: v_min
  # TTC gate thresholds, read by racer_safety/safety_node (claude-docs/05-safety.md layer 3).
  # Both were null, which made the TTC gate a documented no-op: the moment a LiDAR is fitted
  # and /scan starts arriving, no obstacle however close would have braked the car (GitHub
  # issue #36).
  #
  # PROVISIONAL, NOT TUNED: 0.5 s to brake and 1.0 s to warn are the conventional
  # F1TENTH-class starting points, the same pair this repo's L3 TTC test had been passing as
  # an override since the gate was written. They are NOT derived from this car's braking
  # distance, which nobody has measured. They are here so the gate is ARMED rather than inert
  # on the first drive with a scan. Replace with tuned values from Phase 1/2 braking-distance
  # data (roadmap phase 1/2, claude-docs/05-safety.md).
  #
  # KNOWN LIMITATION of the TTC estimate itself, separate from these numbers: safety_node has
  # no /odom, so the forward speed it divides range by is its OWN COMMANDED speed, not a
  # measured one. Slower-than-commanded means TTC is under-estimated (brakes early, the safe
  # direction); coasting faster than commanded means it is over-estimated. That stands until
  # /odom exists.
  #
  # RAISED 2026-10-06 (0.5 -> 1.0 brake, 1.0 -> 2.0 warn), still PROVISIONAL and NOT tuned.
  # Wheels-off bench run that evening (bag 2026-10-06T18-51-39_car_teleop on the Jetson): at
  # the crawl speed teleop and gap_follow actually use, 0.5 s of TTC is 25 cm at 0.5 m/s,
  # which is about the car's own length from the LiDAR to the bumper and leaves no room to
  # coast to a stop (a "brake" here is a coast, see racer_safety/gate_logic.hpp). The same run
  # showed the gate's TTC brake and its own rate limiter fighting each other in a 3-cycle
  # brake/release limit cycle (docs/notes/ttc-limit-cycle-2026-10-06.md); that was a logic
  # bug, fixed in racer_safety, but the threshold was also too small. Release of the latched
  # brake needs the requested speed's TTC to exceed ttc_warning_s, so the warning value is
  # also the brake's release point.
  ttc_warning_s: 0.45               # PROVISIONAL (bench-tuned 2026-10-06, third pass: release line, see 0.8.0 note)
  ttc_brake_s: 0.35                 # PROVISIONAL (bench-tuned 2026-10-06, second pass, see 0.7.2 note)
  # Distance floor for racer_safety's obstacle gate (added 2026-10-06, schema 0.7.0). If the
  # nearest valid return inside the forward sector below is closer than this, forward throttle
  # is held at zero whatever the requested speed, with the same latch as the TTC brake
  # (released once that return is farther than this times the gate's release factor, see
  # gate_logic.hpp). It catches what TTC cannot: a crawl-speed request makes TTC large even
  # when the obstacle is centimetres away. PROVISIONAL, NOT measured: 0.30 m is the
  # 2026-10-06 bench obstacle distance (0.22 m) plus a margin, chosen so that case brakes.
  # Replace with a value from measured coast-down distance at teleop speeds (roadmap phase 2).
  min_forward_clearance_m: 0.20     # PROVISIONAL (bench-tuned 2026-10-06, second pass; measured from the LiDAR, about 0.05 m ahead of the bumper)
  # Half angle of the forward sector, in the VEHICLE frame (base_link, x forward, left
  # positive). Since schema 0.9.0 (2026-10-06 floor test) this is only the OUTER bound of the
  # obstacle gate's in-path test: no return outside it is ever considered, whatever
  # obstacle_corridor_margin_m says. The corridor below is the primary filter. Before 0.9.0 the
  # TTC gate and the distance floor took their minimum range over this whole wedge. Before
  # 2026-10-06 safety_node took the minimum over the whole 360 degree scan, so the car itself,
  # the operator behind it, and a wall beside it all braked a forward command. safety_node
  # converts each laser bearing to a vehicle bearing with sensors.lidar.mount_yaw_rad (pi on
  # this car). PROVISIONAL, NOT tuned: 1.0 rad (about 57 deg each side) covers the car's
  # swept width at full steering lock over the first metre or so; replace when there is
  # driving data to tune against.
  ttc_forward_sector_half_angle_rad: 1.2   # PROVISIONAL (widened 2026-10-06 with the corridor gate, see 0.9.1 note)
  # Lateral margin of the obstacle gate's path corridor (added 2026-10-06, schema 0.9.0). A LiDAR
  # return at vehicle bearing theta and range r (x = r cos theta ahead, y = r sin theta left)
  # counts for the TTC brake and the distance floor only if x > 0 and
  # |y| <= chassis.width_m / 2 + this margin, and the distance used is x, not r. racer_safety
  # reads chassis.width_m and this field from the generated binding. Reason: on the first floor
  # test (backpack track about 1 m wide) a bag 0.3 m beside the path braked the car like a bag
  # straight ahead under the old wedge (see the 0.9.0 header note). PROVISIONAL, NOT tuned:
  # 0.05 m each side is a starting allowance for LiDAR noise and a slightly wider swept path
  # than the bounding box; widen it if the car clips things it should have braked for, narrow
  # it if bags beside the path still brake it.
  obstacle_corridor_margin_m: 0.05  # PROVISIONAL (floor-test choice 2026-10-06, NOT tuned) -- see above
  # Steering hold on the obstacle latch (added 2026-10-06 late, schema 0.8.0). A TTC or
  # clearance brake zeroes forward throttle and keeps steering live, because a car braking at
  # speed must keep steering authority. Once the latch has held the OUTPUT speed at exactly
  # zero for this long, racer_safety's gate freezes the steering output at the angle it had
  # when the hold started, until the latch releases (or a reverse request moves the car
  # again). Reason: on the 2026-10-06 stand run a car parked against an obstacle kept hunting
  # its servo as gap_follow_node's steering request wandered. Caveat: zero speed on /drive is
  # a coast, and safety_node has no /odom, so this time stands in for "the car has stopped".
  # PROVISIONAL, NOT measured: replace with a value from measured coast-down time at teleop
  # speeds (roadmap phase 2). See racer_safety/gate_logic.hpp "STEERING HOLD".
  obstacle_steering_hold_after_s: 0.5  # PROVISIONAL (bench choice 2026-10-06, NOT measured) -- see above
  envelope_fraction_speed: null     # needs Phase 5 tuning (claude-docs/08-learning.md)
  envelope_fraction_lateral_accel: null  # needs Phase 5 tuning (claude-docs/08-learning.md)
  # PROVISIONAL, NOT measured or tuned: 100 ms is roughly five missed frames of a 50 Hz
  # heartbeat, a conservative starting point chosen so the firmware can arm on the bench. The
  # real value comes from the kill-test timing budget. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3).
  mux_watchdog_timeout_s: 0.1       # PROVISIONAL (conservative starting point, NOT tuned) -- see above
  # PROVISIONAL, NOT measured: the midpoint of the standard 1000-2000 us RC range. A
  # two-position kill switch reads near 1000 us or near 2000 us, so any threshold between them
  # separates them -- but this receiver/transmitter pair's actual endpoints are unverified, and
  # so is which end is ARMED. Replace by bench measurement:
  # docs/notes/hardware-arrival-checklist.md section 3 (roadmap task 1.3).
  mux_kill_switch_threshold_us: 1500.0  # PROVISIONAL (range midpoint, NOT measured) -- see above

meta:
  # PROVISIONAL VALUES STILL PRESENT: the six firmware/safety_mux throttle-channel PWM
  # fields, plus actuation.throttle_full_scale_mps and the two limits.ttc_*_s thresholds
  # added or filled in on 2026-09-13, are placeholders, NOT measured, NOT fitted (see the
  # header block and each field's inline comment). The three steering.pwm_*_us fields and
  # steering.pwm_left_bound are the exception as of 2026-09-21: they ARE measured (see the
  # steering section above). Added 2026-09-29: actuation.throttle_deadband_us is
  # PROVISIONAL (a copied VESC setting), and the two actuation.*_pwm_achieved_period_us
  # fields are MEASURED at the mux. Added 2026-10-05: the four sensors.lidar mount fields are
  # PROVISIONAL placeholders; sensors.lidar_spec is datasheet values. Added 2026-10-06:
  # limits.min_forward_clearance_m and limits.ttc_forward_sector_half_angle_rad are
  # PROVISIONAL, and the two limits.ttc_*_s were raised (still PROVISIONAL). Added 2026-10-06
  # late: limits.obstacle_steering_hold_after_s is PROVISIONAL. Added 2026-10-06 night:
  # limits.obstacle_corridor_margin_m is PROVISIONAL. sysid_session_id stays
  # "none-preliminary" -- there is still no on-vehicle fit of any kind, and this file is less
  # fitted than that name implies, not more. (meta is additionalProperties:false in config/vehicle_params.schema.json, so this
  # note lives as a comment rather than a tenth meta key.)
  schema_version: "0.9.1"
  sysid_session_id: "none-preliminary"
  fit_date: "2026-08-22"            # date this preliminary, gym-sourced file was assembled -- not a sysid fit date
