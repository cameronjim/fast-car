[project]
name = "racer-eval"
version = "0.1.0"
description = """
Analysis code of the Plug-and-Play v0.2 pre-registration (docs/notes/preregistration-pnp-v0.2.md):
the split loader, interval statistics, lap tables, run finding, the intervention counting rule,
lap-index curves, the GP3 and GP4 decisions, the planner and sim battery acceptance, and the
interleaved run order. The reported numbers come from tested code or they are not reported.

Bag reading (bag_io.py, mcap) is in the `bags` dependency group so CI does not need it.
"""
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
bags = [
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Real-data glue: reads mcap bags, exercised by the baseline command on the car's bags.
omit = [
    "*/bag_io.py",
    "*/__main__.py",
]
