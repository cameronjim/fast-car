# Pre-registered data split for Plug-and-Play v0.2 (GP1 perception, GP2 dynamics).
# Written 2026-11-13 before any v0.2 training or evaluation. Do not edit after the first commit.
# Rationale and decision rules: docs/notes/preregistration-pnp-v0.2.md.
#
# Time axis: seconds after the first /scan message of the bag (recorder log time), the axis of
# tools/pnp_replay/bag.py. first_scan_log_time_s is that message's log time, for checking.
# A sample belongs to a segment only if EVERY message it was built from (the scans of a label's
# submap, the commands and odometry of a dynamics window) lies inside [from, to] of that one
# segment. Anything outside every segment is unused: not trained on, not evaluated.
# Roles per workstream: train | heldout | heldout_layout | legacy_70_30 | unused.
#   heldout         in-layout held-out (the 2026-11-13 loop), decides GP1 and GP2a
#   heldout_layout  a layout the perception net never trains on, decides the cross-layout part of GP1
#   legacy_70_30    the dyn-v0.1 rule: first 70 percent of the bag's moving data train, the rest
#                   reported as "legacy held-out", never used for a v0.2 decision
split_id: pnp-v0.2
bags_root: /Users/cameronjim/code/car-data/bags
layout_2026_11_13: "loop of about 7.4 m around a 0.4 m central box, min line radius 0.83 m"
