# Pre-registered constants for the yaw-only residual attempt of 2026-11-23: candidate R6 on
# dyn-v0.1, gate GP2g-R, confirmation GP2g-C, and the dynamics roles of the 2026-11-22 session.
# Written 2026-11-23 by the designer after owner decision 27, BEFORE any fit of this attempt.
# Rules: claude-docs/briefs-v0.5/54-dynamics-yaw-residual-r6.md, copied into
# docs/notes/preregistration-pnp-v0.6-dynamics-yaw.md by the implementer's first commit.
# Do not edit after the first commit. Every earlier prereg file and result is unchanged and stands:
# GP2a (PR 167) FAIL, GP2c-Y FAIL, GP2c-R FAIL, GP2d-N FAIL, GP2d-R FAIL (P1 0.9517 against 0.95),
# GP2e-T FAIL, GP2f-S FAIL, GP2f-T FAIL.
prereg_id: pnp-v0.6-dynamics-yaw
written: 2026-11-23
supersedes: nothing
owner_decision: {source: claude-docs/owner-decisions-2026-11-16.md, item: 27}
v05_dynamics_file: evaluation/prereg/pnp-v0.5-dynamics.yaml
v04_file: evaluation/prereg/pnp-v0.4.yaml
v04_sha256: 78510c1423278f80c42511e6caab095818598af6db6a284dd5479f74a03a1d63
v04_addendum_sha256: ada5a83675e5c843fb8e121a1190e4458f823b1ed2ff32a34a46c5fb4ff76824

base_nominal: dyn-v0.1-2026-11-12        # byte for byte; nothing of it is refitted
comparison_model: dyn-v0.1-2026-11-12    # the model on the car, residual disabled
truth: wheel_seeded_icp                  # T2, flags and windows as pnp-v0.4.yaml `dynamics`
alt_truth: {icp_seed_translation_scale: 0.80}   # T2s

what_the_designer_read:
  - the run list of the 2026-11-22 bag (tools/pnp_data.py runs-v05): times, direction, distance, top wheel speed
  - nothing else of that bag; no dynamics model was scored on it by the designer
run_list_2026_11_22:        # seconds from the bag start, for information; the split tool recomputes it
  R0: {kind: pnp, start_s: 405.9, end_s: 476.1, direction: ccw, max_wheel_mps: 1.08}
  R1: {kind: pnp, start_s: 594.5, end_s: 699.5, direction: ccw, max_wheel_mps: 1.17}
  R2: {kind: pnp, start_s: 838.1, end_s: 915.9, direction: ccw, max_wheel_mps: 1.12}
  R3: {kind: pnp, start_s: 1048.2, end_s: 1108.7, direction: cw, max_wheel_mps: 1.17}
  R4: {kind: pnp, start_s: 1199.7, end_s: 1400.1, direction: cw, max_wheel_mps: 0.95}

data_roles:                 # dynamics roles only
  train:
    - every train role of pnp-v0.5-dynamics.yaml (v0.2 train, legacy train, 2026-11-14 dynamics train, 2026-11-15 session train parts)
    - the train parts of the 2026-11-22 runs by `session_2026_11_22` below
  selection:                # read before; never fitted on; chooses config and shipping seed
    - the dynamics heldout segments of 2026-11-14
    - the heldout parts of the 2026-11-15 session
  heldout:                  # decides GP2g-R; scored once, in one pass, after R6 is frozen
    - the heldout parts of the 2026-11-22 runs by `session_2026_11_22` below
  confirmation_only:        # never train, selection or heldout for this attempt
    - every bag recorded after 2026-11-22
  reported_only:
    - the v0.2 split heldout segments

session_2026_11_22:
  bag: /Users/cameronjim/code/car-data/session-2026-11-22/2026-11-23T03-50-32_car_teleop   # the 417 MB file
  not_this_copy: /Users/cameronjim/code/car-data/bags/2026-11-23T03-50-32_car_teleop        # 155 MB, cut short, two runs only
  rule: session_2026_11_15 of pnp-v0.5-dynamics.yaml, unchanged
  min_run_s: 15.0
  min_wheel_distance_m: 1.0
  train_share: 0.55
  guard_s: 2.0
  heldout: the rest of the run
  sample_rule: a sample belongs to a part only if every message it was built from lies inside it
  file: evaluation/prereg/sessions/2026-11-22-dynamics-v06.yaml   # written by the tool, committed with its SHA-256 before any fit
  order: [split, m_b3, fit, freeze, heldout_pass]

candidate:                  # R6
  kind: yaw-only residual of v0.3 and v0.4 (output_scale[0] = 0), recipe of R4 unchanged
  bundle_schema: 1.x, no bump, no new field
  seeds: [0, 1, 2]
  configs: those of R4 in pipeline_v04
  chosen_by: selection P1, before the heldout pass
  validity_v_max_mps: 1.3   # dyn-v0.1's; this attempt never raises it
  pointer: training/pnp_models/dyn-v0.6r-<date>

measurements:
  m_b3:                     # on the new train data, written down before the heldout pass
    perfect_yaw_ratio_out_of_reach_above: 0.95
    sentence_if_above: "item 1 is not expected to be met by a yaw-only model on this data"

metrics:                    # those of pnp-v0.5-dynamics.yaml, unchanged
  horizons_s: [0.5, 1.0, 1.5]
  window_start_period_s: 0.25
  min_start_speed_mps: 0.25
  speed_bins_mps: [0.25, 0.6, 0.85, 1.25]
  min_windows_per_stratum: 30
  bootstrap: {block_s: 5.0, resamples: 2000, seed: 0}
  near_limit: {min_mean_abs_steering_share: 0.85, min_windows_per_side: 30}
  transition: {min_speed_command_change_mps: 0.2, min_windows: 30}
  pose_check_segments: [G1b, T2b]

gate_residual:              # GP2g-R, R6 against dyn-v0.1 on heldout under T2
  item_0_enough_data:
    min_windows_total: 400
    min_windows_per_direction: 150
    min_strata_with_30_windows: 4
    not_met: INSUFFICIENT             # not a pass; the residual stays off
  max_p1_ratio: 0.95                  # GP2c-R and GP2d-R, unchanged
  max_p1_ratio_bootstrap_upper: 1.00  # below, unchanged
  max_y1_ratio: 0.90                  # tighter than the earlier 1.00
  speed_equal_tolerance: 1.0e-6       # S1, unchanged
  max_seed_p1_ratio: 1.00             # every seed, unchanged
  max_stratum_ratio: 1.05             # every stratum with 30 windows, unchanged
  sweep_samples: 100000               # finite, inside the state bounds, unchanged
  max_pose_yaw_ratio: 1.00            # Yp on G1b and T2b, unchanged
  per_direction: {max_p1_ratio: 1.00, max_y1_ratio: 1.00}
  max_cross_ratio: 1.00               # C1
  max_along_ratio: 1.02               # A1
  max_near_limit_ratio: 1.00          # each side with 30 windows; fewer: cannot be applied
  max_transition_ratio: 1.00          # with 30 windows; fewer: cannot be applied
  max_p1_ratio_alt_truth: 1.00        # T2s
  saturation: {level: 0.9, max_heldout_step_share: 0.01}
  solve_cost: {tool: mppi_bench, max_p50_ratio_to_nominal: 1.25}
  canary: {suite: tests/l5_pnp, contacts_allowed: 0, all_cases_complete: true}

named_outcome_not_a_deployment_rule:     # v0.4 section 2.4, unchanged
  improves_heading_not_position: {max_y1_ratio: 0.80, max_cross_ratio: 0.90, cross_bootstrap_upper_below: 1.00,
                                  max_p1_ratio: 1.00, max_stratum_ratio: 1.05}

gate_confirmation:          # GP2g-C, on the car, only after GP2g-R passed
  golden_rollout_tolerance: 1.0e-9
  fresh_driving: {from: confirmation_only bags driven on dyn-v0.1, min_total_s: 120, min_per_direction_s: 40,
                  max_p1_ratio: 1.00, max_y1_ratio: 1.00}
  switch_on: {cap_mps: 1.0, laps_per_model_per_direction: 5, order: interleaved, max_contacts: 0,
              max_extra_safety_brakes: 0, min_mean_wheel_speed_ratio: 0.98}
  launch: "dynamics_bundle:=<path of dyn-v0.6r>; the default stays dyn-v0.1"

outcomes:
  pass: "candidate: yaw-only residual beats dyn-v0.1 on fresh real driving"   # still off until GP2g-C
  insufficient: "undecided, too little heldout data"
  fail: the residual stays off, dyn-v0.1 stays, pointer README says do-not-deploy, the table is the result
