# Pre-registered constants for the D v1 attempt of 2026-11-23: development ablations M-D1b, the
# candidate rule, sim battery B11 and the gates D11-S0 to D11-S3 (D v1 against D v0 at equal safety).
# Written 2026-11-23 by the designer after owner decision 27, BEFORE any D v1 code of this attempt.
# Rules: claude-docs/briefs-v0.5/53-dv1-ablations-b11.md, copied into
# docs/notes/preregistration-pnp-v0.6-laps-dv1.md by the implementer's first commit.
# Do not edit after the first commit. Every earlier prereg file and result is unchanged and stands:
# D-S0 FAIL, D-S1 FAIL, D-S2 PASS (v0.2); D3-S0 FAIL, D3-S2(d) FAIL, D3-S2(e) PASS (B4); B5 and B6
# never run; D10 PASS for D v0 on the truth source (B10).
schema: pnp-prereg-laps/5
prereg_id: pnp-v0.6-laps-dv1
written: 2026-11-23
supersedes: nothing
owner_decision: {source: claude-docs/owner-decisions-2026-11-16.md, item: 27}
v05_laps_camera_2_file: evaluation/prereg/pnp-v0.5-laps-camera-2.yaml
v05_laps_camera_2_sha256: 823f641c8a40337e1a81aaa440d55976585d19984ae2db55f06f0eee1289bdcd
v04_addendum_file: evaluation/prereg/pnp-v0.4-addendum-1.yaml
v04_addendum_sha256: ada5a83675e5c843fb8e121a1190e4458f823b1ed2ff32a34a46c5fb4ff76824

common:
  lap_source: truth                 # owner decision 12; through racer_laps.start_ready.StartReadyGate as B10
  source_rule: pnp-v0.5-laps-camera-2.yaml source_rule, unchanged (a test compares the blocks)
  lap1_cap_mps: 0.5
  ceiling: dynamics bundle validity v_max_mps (config/pnp/fixtures/dyn-car-2026-11-12)
  plant: car-like (as pnp-v0.3.yaml lap_battery), scan noise on
  laps_judged: 12
  laps_driven: 13
  late_laps: [8, 9, 10]             # T_late = median lap time of these, truth crossings
  validity: {min_real_time_factor: 0.8, max_scan_wait_s: 0.25, max_attempts: 3,
             invalid_counts_as: failed_to_execute, starved_attempt: rerun_alone_all_attempts_kept}
  caution_zone_rule: cap_wins_hold_below_floor     # owner decision 5 of 2026-11-14, every candidate

development:                # M-D1b; may be rerun, every run reported, decides no gate
  seeds: [11, 12, 13]
  cases: [T, S1, S2, S3, S4, ND, N1, N2, N3, P1, P2, P3, V1, V2, V3]   # all read before
  minimum_cases: [T, S1, S2, S3, N1, N3]
  directions: [ccw, cw]
  conditions:
    a: lap memory off, lap 1 cap
    b: lap memory off, ceiling
    c: D v0 (cap schedule alone), as on main
    m: speed memory as a bound, the planner's own progress reward, no value profile
    f: D v1 with the value profile frozen after the first clean lap
    u: D v1 as registered (updating value profile, value replaces progress)
    t: lap memory off, ceiling, terminal speed bound from visible curvature
    z: D v1 with cap_wins
  candidates:               # every one with cap_wins, lap_station_mode track, station_uncertainty on, reset_on_change on
    K1: lap_reward_mode keep_progress, speed bound from memory, no value profile
    K3: lap_reward_mode replace, value_profile_mode freeze_after_first_clean_lap
    K2: lap_reward_mode replace, value_profile_mode update
  tunable_on_development_only: [station uncertainty rate and cap, reset thresholds, terminal_curvature_bound a_lat]
  candidate_rule:
    eligible: {contacts: 0, runs_not_completing_12_laps: 0, stalls_over_s: 5.0, stalls_allowed: 0,
               mean_ttc_or_obstacle_brakes_per_lap_late_max: 0.2}
    score: median over paired runs of T_late(K) / T_late(c), minimum_cases at least
    pick: lowest score among eligible
    tie_within: 0.01
    tie_order: [K1, K3, K2]         # simpler first
    max_score_to_run_b11: 0.97
    else: "B11 not run: no development benefit"   # W cases and seeds 91, 92 stay unread
  freeze: {branch: feat/pnp-dv1, file: evaluation/prereg/freeze/b11.json,
           records: [commit_sha, main_sha_contained, candidate, tuned_values, defaults_bit_identical_test]}

lap_battery_b11:
  id: B11
  runs_once: true
  seeds: [91, 92]
  directions: [ccw, cw]
  cases:
    W1: {track: stadium, lane_width_m: 1.15, straight_length_m: 3.8, island_radius_m: 0.47}
    W2: {track: rounded_rect, lane_width_m: 1.0, straight_length_m: 2.8, island_width_m: 1.7, island_radius_m: 0.38}
    W3: {track: stadium, lane_width_m: 1.3, straight_length_m: 1.2, island_radius_m: 0.58}
    W4: {track: stadium, lane_width_m: 0.95, straight_length_m: 4.2, island_radius_m: 0.5}
  never_run_before_the_freeze: {cases: [W1, W2, W3, W4], seeds: [91, 92]}
  spent_never_used: {seeds: [21, 22, 23, 31, 32, 41, 42, 61, 62, 63, 71, 72, 81, 82]}
  drop_rule: {condition: a, seed: 91, min_laps: 3, either_direction: true, max_dropped: 1, min_cases_left: 3}
  conditions:
    a: {lap_memory: off, cap_mps: 0.5, seeds: [91]}
    b: {lap_memory: off, cap: ceiling}
    c: {lap_memory: v0}
    k: {lap_memory: v1, config: frozen_candidate}
    t: {lap_memory: off, cap: ceiling, terminal_curvature_bound: on}
    kf: {lap_memory: v1, config: frozen_candidate, faults: fault_plan}
  fault_plan: pnp-v0.5-laps-camera-2.yaml lap_battery_b10.fault_plan, unchanged
  oracle_ready_after_s: {91: 0.0, 92: 6.0}
  runs_planned: 88            # a 8, then b, c, k, t, kf at 16 each
  pairing: same case, direction and seed
  thresholds:               # "of_16" with no case dropped, "of_12" with one case dropped
    s0: D10-S0 items 1 to 5 of pnp-v0.5-laps-camera-2.yaml, unchanged, on every c and k run
    s1:                     # the baseline is healthy: D10-S1 on the c runs
      contacts_allowed: 0
      min_complete: {of_16: 15, of_12: 11}
      complete_laps: 10
      reach_ratio_to_b: 1.05
      reach_min_runs: {of_16: 15, of_12: 11}
      median_r_max: 0.80
      fail_means: "no result: the D v0 baseline failed, D v1 is not judged"
    s2:                     # D v1 against D v0, equal safety
      contacts_allowed_k: 0
      min_complete_k: {of_16: 15, of_12: 11}
      complete_k_not_fewer_than_c: true
      stalls_over_s: 5.0
      stalled_k_runs_allowed: 0
      median_paired_t_late_ratio_k_over_c_max: 0.95     # D-S2 and D3-S2 threshold, unchanged
      worst_paired_t_late_ratio_k_over_c_max: 1.03
      mean_ttc_or_obstacle_brakes_per_lap_late_max: 0.2  # D-S2 and D3-S2 threshold, unchanged
      safety_engagements: {count: PHASE_ENGAGE records of /safety/events, laps: [2, 12],
                           sum_over_k_runs_at_most: sum over the paired c runs}
      clearance: {metric: lowest body to wall clearance of the run on laps 8 to 10,
                  median_over_k_runs_at_least: median over c runs minus 0.03 m}
      lap1: speed command on lap 1 never above lap1_cap_mps plus 0.01
      ceiling: speed command never above the ceiling plus 0.01
    s3:                     # the candidate under lap source faults
      contacts_allowed: 0
      min_complete_12_truth_laps: {of_16: 15, of_12: 11}
      mean_ttc_or_obstacle_brakes_per_lap_all_laps_max: 0.2
      cap_after_doubtful: not_above_cap_of_doubtful_lap       # D10-S2 item 5, unchanged
      overdue_min_guidance_cap: lap1_cap                      # D10-S2 item 6, unchanged
      speed_bound_after_doubtful: no station bound of the lap after a doubtful lap above that station's bound in the doubtful lap
  reported_no_threshold:
    - paired T_late(t) / T_late(k) and T_late(k) / T_late(b)
    - sum of lap times 2 to 10 per condition
    - laps to first reach 1.05 x T_late(b)
    - resets and their reasons, share of ticks limited by the memory bound
  outcomes:
    pass: "D v1 faster than the schedule in sim at equal safety"     # S0, S1, S2 and S3 all pass
    fail_s2_ratio_only: "no better than the schedule in sim"
    fail_s2_safety_or_s3: "unsafe in sim"
    fail_s0: "lap bookkeeping failed, not judged"
    note_if_t_within_0.02_of_k: "gain not shown to need memory"       # added to the outcome, not a fail
  on_pass: {car: none_yet, next: integration by the single implementer, launch: "lap_mode:=v1, default stays off"}
  on_fail: D v0 stays. The result stands. W cases and seeds 91, 92 are spent.
