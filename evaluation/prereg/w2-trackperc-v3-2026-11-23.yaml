# trackperc-v3: data roles, held-out sets and the ship rule, stated BEFORE any v3 training or any
# v3 scoring (overnight 2026-11-23, workstream W2, owner decision 29: an unregistered development
# candidate, runnable on the car behind the existing backend:=net / bundle switch; geometric stays
# the default). This is not a gate: GP1 and its successors decide what counts as a result.
# Do not edit after the first commit; a change is a new file.
#
# Format: the split format of evaluation/prereg/pnp-v0.2-split.yaml (racer_pnp_perception.split),
# so selflabel --split, train --split and the scoring read it unchanged. Time axis: seconds after
# the first /scan message of the bag by recorder log time.
#
# Registered held-out data is NOT touched by v3 (neither trained on nor scored), so it stays fresh
# for a registered gate later: every 2026-11-14 bag (pnp-v0.4.yaml heldout and reserve, the
# heldout_14 of pnp-v0.6-perception-fused.yaml) and the 2026-11-22 bag
# (session-2026-11-22/2026-11-23T03-50-32_car_teleop, heldout_22). Those bags are absent below,
# so every tool treats them as unused.
#
# Held-out sets of this file (role heldout_layout and heldout below), scored once for v2 and v3
# together after v3 is frozen:
#   H-layout   2026-11-12 layout, both bags whole: a layout no net has trained on (v2 used it only
#              as development and cross-layout scoring). Decides the ship rule (the known
#              weakness is unseen layouts). Labelled scans for E_c and V; all moving scans for the
#              label-free numbers.
#   H-session  the last 45 percent of every run of the 2026-11-23 session (cut rule of
#              pnp-v0.4.yaml future_sessions: first 55 percent train, 2.0 s guard, rest held out).
#              The first 55 percent is v3 training data, so this is "same layout, later in the
#              run", reported and part of the rule only as a non-inferiority check.
#
# Backends compared, all through TrackPerceiver.process (the node's code), refinement on as each
# bundle declares (both circ_conv1d_v0_refine_v1): trackperc-v2-2026-11-14, trackperc-v3 candidate,
# geometric-v1 for reference.
#
# Ship rule (v3 replaces nothing by default; "ship" means the bundle is published beside v2):
#   on H-layout: E_c(v3) <= E_c(v2) and V(v3) >= V(v2) - 0.25 and C95(v3) >= C95(v2) - 0.02
#                (labelled scans) and mean intrusion(v3) <= max(0.02, intrusion(v2) + 0.005)
#                (all moving scans);
#   on H-session: E_c(v3) <= 1.05 E_c(v2) and V(v3) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's (same
#   architecture, so this only catches an export mistake).
#   Otherwise v3 is reported and v2 stays the published net.
# E_c, V, C95 and the label-free numbers are the GP1 definitions (racer_pnp_perception.gp1:
# score_row, labelled_numbers, label_free_numbers), moving scans by wheel speed >= 0.2 m/s.
#
# Recipe (frozen with this file): racer_pnp_perception.train, init from the v2 weights (seed 1 run
# of runs-v2/full), 6 epochs, batch 256, lr 1e-3, real fraction 0.75, scale augmentation [0.75,
# 1.4] with probability 1.0 (the v2 recipe), seeds 0 1 2, the seed with the lowest final internal
# validation E_c chosen (internal validation only). Simulation: a fresh dataset of random tracks
# (racer_pnp_perception.dataset, new seed 23, 300000 train / 20000 val) with the LiDAR-model
# randomisation of dataset --lidar-dr (mount yaw and offset error, range scale and bias,
# range-dependent dropout, dark low-return sectors), on top of the v0 nuisances.
