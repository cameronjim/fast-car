# trackperc-v4: data roles, held-out sets, labels and the ship rule, stated BEFORE any v4 training or
# any v4 scoring (2026-11-25, owner decision 35, an unregistered development candidate under
# decision 29, runnable on the car behind the existing backend:=net / bundle switch; geometric stays
# the default and the prototype profile keeps v2 unless v4 ships). This is not a gate: GP1 and its
# successors decide what counts as a result. Do not edit after the first commit; a change is a new
# file.
#
# Format and roles: exactly those of evaluation/prereg/w2-trackperc-v3-2026-11-23.yaml (the bags and
# segments below are copied unchanged; only split_id differs), read by selflabel --split, train
# --split and compare_v4 unchanged. Time axis: seconds after the first /scan message of the bag by
# recorder log time.
#
# Registered held-out data is NOT touched by v4 (neither trained on nor scored): every 2026-11-14
# bag (pnp-v0.4.yaml heldout and reserve, heldout_14 of pnp-v0.6-perception-fused.yaml) and the
# 2026-11-22 bag (session-2026-11-22/2026-11-23T03-50-32_car_teleop, heldout_22; decision 28 item 5
# keeps it held out for A). Those bags are absent below, so every tool treats them as unused.
#
# What is new against v3: the labels. Self-labels are made with the fast RMS gate of decision 35
# (selflabel --moving-mps 0.2 --rms-gate-fast 0.025 --rms-fast-speed 0.8: an ICP interval faster
# than 0.8 m/s passes the RMS item at 0.025 m instead of 0.02 m; every other label gate unchanged)
# into car-data/pnp/labels/selflabels-v4-fast. Those labels were counted (not scored against any
# net) before this file was written: train 17256 (v3 set 16120), H-layout 1122 (1070), H-session
# 747 (11). The same label set is used for training (role train) and for every held-out number
# below, for v2 and v4 alike.
#
# Held-out sets (role heldout_layout and heldout below), scored once for v2 and v4 together after
# v4 is frozen:
#   H-layout   2026-11-12 layout, both bags whole: a layout no net has trained on. Decides the
#              ship rule (the known weakness is unseen layouts). Labelled scans for E_c, V and
#              C95; all moving scans for the label-free numbers.
#   H-session  the last 45 percent of every run of the 2026-11-23 session (first 55 percent is
#              train data, 2.0 s guard). Same layout, later in the run, at up to 1.3 m/s.
#
# Backends compared, all through TrackPerceiver.process (the node's code), refinement on as each
# bundle declares (all circ_conv1d_v0_refine_v1): trackperc-v2-2026-11-14 (the published net),
# trackperc-v4 candidate, geometric-v1 and the v3 candidate for reference only (they decide
# nothing).
#
# Ship rule (v4 replaces nothing by default; "ship" means the bundle is published beside v2 in
# car-data/pnp/models; otherwise it stays in models-candidate, selectable as "(candidate)"):
#   on H-layout: E_c(v4) <= E_c(v2) and V(v4) >= V(v2) - 0.25 and C95(v4) >= C95(v2) - 0.02
#                (labelled scans) and mean intrusion(v4) <= max(0.02, intrusion(v2) + 0.005)
#                (all moving scans);
#   on H-session: at least 300 labelled scans (else the item fails), E_c(v4) <= 1.05 E_c(v2) and
#                V(v4) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's (same
#   architecture, so this only catches an export mistake).
#   Otherwise v4 is reported and v2 stays the published net.
# E_c, V, C95 and the label-free numbers are the GP1 definitions (racer_pnp_perception.gp1:
# score_row, labelled_numbers, label_free_numbers), moving scans by wheel speed >= 0.2 m/s.
# Also reported (decides nothing): the same numbers on the v3 label set (selflabels-v3), CPU per
# scan of v4 against v2 (racer_pnp_perception.latency).
#
# Recipe (the v3 recipe, frozen with this file): racer_pnp_perception.train, init from the v2
# weights (seed 1 run of runs-v2/full), 6 epochs, batch 256, lr 1e-3, real fraction 0.75, scale
# augmentation [0.75, 1.4] with probability 1.0, seeds 0 1 2, the seed with the lowest final
# internal validation E_c chosen (internal validation only). Simulation: the v3 set reused
# unchanged (trackperc-v3dr-train-s23-n300000.npz / trackperc-v3dr-val-s23-n20000.npz, random
# tracks with dataset --lidar-dr). Real: the role train labels of selflabels-v4-fast.
