# trackperc-v5: recipe, data roles, held-out sets, labels and the ship rule, stated BEFORE any v5
# scoring on a held-out set (2026-11-25, owner decision 37a, an unregistered development candidate
# under decision 29, runnable on the car behind the existing backend:=net / bundle switch; geometric
# stays the default and the prototype profile keeps v2 unless v5 ships). This is not a gate: GP1 and
# its successors decide what counts as a result. Do not edit after the first commit; a change is a
# new file.
#
# Format and roles: exactly those of evaluation/prereg/w2-trackperc-v4-2026-11-25.yaml (the bags and
# segments below are copied unchanged; only split_id differs). Labels: the v4 label set unchanged,
# car-data/pnp/labels/selflabels-v4-fast (fast RMS gate of decision 35), for training (role train)
# and for every held-out number, for v2 and v5 alike. Registered held-out data stays untouched
# (every 2026-11-14 bag, the 2026-11-22 bag): absent below.
#
# Diagnosis of the v3/v4 valid-range (V) loss, made on the train-role labels' internal validation
# cut (last 15 percent of each train segment, 2341 labels) and the simulation validation sets only;
# no held-out set was read. V is the leading run of stations with predicted sigma under the node's
# 0.25 m gate, so V is the sigma head.
#   * Not the labels' valid-station balance: 99.6 percent of train labels have all 16 stations.
#   * Not the simulation set or the init: v4's recipe with the v0 simulation set (internal V 15.82)
#     or initialised from the sim-only v0 net (15.85) keeps the loss (v4 seed 0: 15.83; v2 on the
#     same cut: 15.97). Simulation V is unchanged (v2 15.78, v4 15.80 on the v3dr validation set).
#   * Where: only on the bags added since v2 (2026-11-16, 2026-11-23 session 2): v4 V 14.97 / 15.12
#     there (v2 15.84 / 16.00); older bags 15.96 (v2 15.99). On those bags v4's x, y error is LOWER
#     than v2's (E_c 0.108 vs 0.154) but its sigma is higher: the Gaussian likelihood on noisy
#     self-labels teaches sigma the label's error. Two mechanisms: (a) far stations' sigma over
#     0.25 m (about a third of the loss); (b) whole-track collapse, V = 0, when station 0's sigma
#     passes 0.25 m in tight turns (15 of 337 2026-11-16 validation scans, about two thirds).
#   * Tried and rejected on the same data: real labels never training sigma (V 15.55: old bags lose
#     the last station), a label-noise term in the full training (fixes (a), not (b), and worsens
#     E_c because it also down-weights the real x, y fit).
#
# Recipe changes (2, chosen on the internal validation cut only):
#   1. Label-noise-aware likelihood for real self-labels: the real samples' variance is
#      sigma^2 + s^2 with s = 0.10 m at every station (train --real-label-sigma-near 0.10), so the
#      predicted sigma describes the net's own error, not the label's. Simulation labels are exact
#      (s = 0). Chosen as the smallest s tried (0.05, 0.10, with and without a far ramp) whose
#      internal validation V reached v2's on the same cut (15.97): 0.10 gave 15.98 (0.05: 15.92).
#   2. Applied as a sigma-head refit after the v4 recipe: 1 epoch (batch 256, lr 1e-3, real
#      fraction 0.75, scale augmentation as v4) training ONLY the fc1 rows that output log_sigma
#      (train --sigma-head-only), every other weight frozen, so x, y and the half widths are
#      exactly those of the stage-1 net.
# Stage 1 is the v4 recipe, frozen at b57cd18: the three existing v4 seed runs
# (car-data/pnp/runs-v4/full/seed{0,1,2}) are reused unchanged as the stage-1 nets. Each gets the
# stage-2 refit with the same seed number; the seed with the lowest final internal validation E_c is
# chosen (internal validation only, the v4 rule). Internal validation of the screened setting on v4
# seed 0: V 15.83 -> 15.98, E_c 0.0667 -> 0.0678 (the extra stations it now keeps are far ones).
#
# Held-out sets (role heldout_layout and heldout below), scored once for v2 and v5 together after
# v5 is frozen, through TrackPerceiver.process with refinement (all circ_conv1d_v0_refine_v1):
#   H-layout   2026-11-12 layout, both bags whole.
#   H-session  the last 45 percent of every run of the 2026-11-23 session (2.0 s guard).
# Reference only (decides nothing): v4 and geometric-v1.
#
# Ship rule: the v4 rule, unchanged and unloosened ("ship" means the bundle is published beside v2
# in car-data/pnp/models; otherwise it stays in models-candidate, selectable as "(candidate)"):
#   on H-layout: E_c(v5) <= E_c(v2) and V(v5) >= V(v2) - 0.25 and C95(v5) >= C95(v2) - 0.02
#                (labelled scans) and mean intrusion(v5) <= max(0.02, intrusion(v2) + 0.005)
#                (all moving scans);
#   on H-session: at least 300 labelled scans (else the item fails), E_c(v5) <= 1.05 E_c(v2) and
#                V(v5) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's.
#   Otherwise v5 is reported and v2 stays the published net.
# E_c, V, C95 and the label-free numbers are the GP1 definitions (racer_pnp_perception.gp1),
# moving scans by wheel speed >= 0.2 m/s; scored with racer_pnp_perception.compare_v5 (the
# compare_v4 rule with v5 in v4's place). Also reported (decides nothing): CPU per scan of v5
# against v2 (racer_pnp_perception.latency). If v5 ships, the Racer app prototype profile's
# perception bundle becomes v5.
