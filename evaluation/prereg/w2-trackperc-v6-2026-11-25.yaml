# trackperc-v6 RECORD: recipe, data roles, internal screen and the rule it would have been scored
# against (2026-11-25, owner decisions 29 and 37a, iteration after v5; an unregistered development
# candidate behind the existing backend:=net / bundle switch). Written after the internal screen and
# committed before any held-out set was opened for v6 (none was). Not a gate. Do not edit after the
# first commit; a change is a new file.
#
# Held-out scoring count BEFORE v6: H-layout scored 3 times (v3, v4, v5), H-session 3 times (v3, v4,
# v5). v6 is scored on them at most once, and only if it passes the internal screen below.
#
# Bags, segments and roles: exactly those of w2-trackperc-v5-2026-11-25.yaml (copied unchanged;
# only split_id differs). Labels: car-data/pnp/labels/selflabels-v4-fast, as v4 and v5.
#
# Internal validation plan w2-v6 (real.VAL_PLANS; train-role labels only): the last 45 percent of
# every session 2 train segment, the last 40 percent of every 2026-11-16 bag, the last 15 percent of
# every other train segment. 3159 labels (session 2: 334, 2026-11-16: 864, older bags: 1961), against
# 2341 (43 session 2) in v5. Every number below and every design choice comes from this part (or the
# simulation validation set); scored through TrackPerceiver with the scan refinement, as the node
# runs the bundle. On it, v5's recipe retrained on the w2-v6 train part (v5-dev) shows the H-session
# gap: session 2 V 14.86 against v2 15.34 (H-session: 14.85 against 15.27).
#
# Diagnosis on the internal part (racer_pnp_perception.internal_val plus a decomposition of each
# scan's refined V into a geometry-only count, sigma forced valid, and a sigma-only count, no
# refinement): after v5's sigma refit the session 2 gap is geometric. The scan refinement resamples
# the net's polyline at 0.20 m from the point nearest the car, so its valid count is limited by the
# polyline's arc length (16 stations need 2.95 m). v4/v5 polylines are short on the new bags
# (arc 2.81 m on session 2 and 2.82 m on 2026-11-16, v2 2.89 / 2.93; spacing shrinks to 0.175 to
# 0.185 m at stations 8 to 14): the regression of uncertain far stations towards the car. Session 2
# geometry-only V: v5-dev 14.99, v2 15.40; sigma-only V: v5-dev 15.86, v2 15.93.
#
# Recipe changes (chosen on the internal part only; screened: spacing weight 0.1 and 0.3, sigma
# floor 0.10, 0.15, 0.10 plus a 0.10 m far ramp, a weight average of the three seeds):
#   1. Stage 1 (v4 recipe, init v2 seed 1, 6 epochs, w2-v6 plan) adds the station-spacing prior of
#      the output contract: train --spacing-weight 0.1 (mean of ((|p_k+1 - p_k| - 0.20) / 0.01)^2
#      over labelled pairs, all samples). Session 2 geometry-only V 14.99 -> 15.44.
#   2. Stage 2, the v5 sigma-head refit (1 epoch, only the log_sigma rows of fc1), with the real
#      label noise floor raised from 0.10 to 0.15 m (train --real-label-sigma-near 0.15): with the
#      spacing prior the 0.10 floor left session 2 sigma-only V at 15.50.
#   Seeds 0 1 2; the seed with the lowest final raw internal E_c (train.select_seed): seed 2.
#
# Internal screen (written before any spacing-plus-refit candidate was scored on the w2-v6 part;
# kept in car-data/pnp/runs-v6/internal_screen_rule.txt at the time, committed here). Selected seed
# against v5-dev (selected seed 2) and v2, refined:
#   1. V(v6) >= V(v5-dev) + 0.20 on session 2 and on 2026-11-16
#   2. V(v6) >= V(v2) - 0.10 on session 2 and on 2026-11-16, and >= V(v2) - 0.25 on the older bags
#   3. E_c(v6) <= E_c(v2) on session 2, 2026-11-16 and the older bags
#   4. E_c(v6) <= 1.03 E_c(v5-dev) on all three
# Result: items 1 and 2 pass (session 2 V 15.39, 2026-11-16 15.30, older 15.57; v5-dev 14.86 /
# 14.87 / 15.36; v2 15.34 / 15.18 / 15.40). Item 3 FAILS on the older bags (E_c 0.0757 vs v2
# 0.0743; v5-dev 0.0751 fails it too: v2 trained on most of those bags' cuts) and item 4 FAILS on
# session 2 (0.1672 vs 1.03 x 0.1596 = 0.1644). So v6 is NOT scored on H-layout or H-session.
# H counts after v6: H-layout 3, H-session 3.
#
# Ship rule had it been scored: the v4/v5 rule unchanged and unloosened, v6 in v5's place:
#   on H-layout: E_c(v6) <= E_c(v2) and V(v6) >= V(v2) - 0.25 and C95(v6) >= C95(v2) - 0.02 and
#                mean intrusion(v6) <= max(0.02, intrusion(v2) + 0.005);
#   on H-session: at least 300 labelled scans, E_c(v6) <= 1.05 E_c(v2) and V(v6) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's.
# Candidate bundle car-data/pnp/models-candidate/trackperc-v6-2026-11-25, "(candidate)" in the app.
