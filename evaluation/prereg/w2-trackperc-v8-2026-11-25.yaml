# trackperc-v8: labels, recipe space, internal screen and the ship rule, stated BEFORE any v8
# training run and before any held-out scoring (2026-11-25; coordinator decisions under owner
# delegation: labeller corner and arc-length fix, v8 on the w2-v6 split, the pre-committed screen;
# E_c definition unchanged, an E_c on common stations may be reported and is never a pass item).
# An unregistered development candidate behind the existing backend:=net / bundle switch. Not a
# gate. Do not edit after the first commit; a change is a new file.
#
# Held-out scoring count BEFORE v8: H-layout 3 (v3, v4, v5), H-session 3 (v3, v4, v5). v6 and the
# v7 attempts were not scored. v8 is scored on them at most once, and only if it passes the
# internal screen below on BOTH label sets.
#
# Bags, segments and roles: exactly those of w2-trackperc-v5-2026-11-25.yaml (copied unchanged;
# only split_id differs).
#
# Labels. Training: car-data/pnp/labels/selflabels-v5-arc, made by `selflabel --arc-length-stations
# --corner-smooth-m 0.1` (with the v4 fast RMS gate, 0.2 m/s moving threshold, the same split and
# the same gates; code 1f3fadf). Stations exactly 0.20 m apart in a straight line from the point
# nearest the car, the marched centre Gaussian-smoothed over 0.10 m of arc (half widths move with
# it). Chosen on train-role labels of three dev bags (session 2, 2026-11-16T22-38-47,
# 2026-11-13T22-20-18) by label-free numbers only, among plain / 0.0 / 0.1 / 0.2 m:
#   session 2 train labels      plain    arc 0.1
#     kept                       758      1116
#     station 0-15 chord arc     2.932    3.000 m
#     intrusion mean             0.0007   0.0013
#     deficit p90 mean           0.0222   0.0182 m
#     path containment mean      0.978    0.983
#   2026-11-16T22-38-47: deficit 0.0183 -> 0.0087, containment 0.982 -> 0.989; 2026-11-13T22-20-18:
#   deficit 0.0097 -> 0.0069, containment 0.9852 -> 0.9843. 0.2 m smooths more (deficit lower) but
#   loses full-length labels (16 stations: 92 percent on session 2) and containment on 2026-11-13.
#   With the flag off the labeller reproduces selflabels-v4-fast (same kept counts on the dev bags).
#
# Internal validation: plan w2-v6 (real.VAL_PLANS) on the selflabels-v5-arc train-role labels, and
# the same plan on the selflabels-v4-fast labels (as in v6/v7). Model selection inside the recipe
# space below (stage-1 spacing weight 0 or 0.1; stage-2 sigma floor 0.10 or 0.15 m; seed by final
# raw internal E_c on the arc labels, train.select_seed) uses the arc-label internal part only.
#
# Internal screen: the v7 screen (docs/notes/trackperc-v7-attempts-2026-11-25.md), items and limits
# unchanged, applied twice, once with each label set; v8 is scored on H only if it passes BOTH.
# References: v2 (trackperc-v2-2026-11-14) and v5-dev (car-data/pnp/runs-v6/v5dev/seed2), scored on
# the same labels, refined.
#   1. V >= V(v5-dev) + 0.20 on session 2 and 2026-11-16
#   2. V >= V(v2) - 0.10 on session 2 and 2026-11-16, >= V(v2) - 0.25 on the older bags
#   3. E_c <= E_c(v2) on session 2 and 2026-11-16, E_c <= E_c(v5-dev) on the older bags
#   4. E_c <= 1.03 E_c(v5-dev) on session 2, 2026-11-16 and the older bags
# E_c on common stations is reported beside it and decides nothing.
#
# Ship rule (if scored): the v4/v5 rule unchanged and unloosened, with v8 in v5's place, evaluated
# on the held-out sets TWICE, with the selflabels-v4-fast labels (the registered set) and with the
# selflabels-v5-arc labels; v8 ships only if every item passes on both:
#   on H-layout: E_c(v8) <= E_c(v2) and V(v8) >= V(v2) - 0.25 and C95(v8) >= C95(v2) - 0.02 and
#                mean intrusion(v8) <= max(0.02, intrusion(v2) + 0.005);
#   on H-session: at least 300 labelled scans, E_c(v8) <= 1.05 E_c(v2) and V(v8) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's.
# Scored once with racer_pnp_perception.compare_v5 (the v4 rule, v8 passed as --v5) per label set.
# If v8 ships it is published in car-data/pnp/models and becomes the prototype profile's
# perception_bundle (pnp.launch.py and the app preset, with the Linux suites).
