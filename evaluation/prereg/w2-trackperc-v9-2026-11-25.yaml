# trackperc-v9: recipe space, selection, internal screen and the ship rule, stated BEFORE any v9
# training run and before any held-out scoring (2026-11-25, decision 38: v9 may be screened on the
# arc labels alone, v4-fast numbers reported and not gating; H scoring exactly as registered). An
# unregistered development candidate behind the existing backend:=net / bundle switch. Not a
# gate. Do not edit after the first commit; a change is a new file. v8's verdict (FAIL) stands.
#
# Held-out scoring count BEFORE v9: H-layout 3 (v3, v4, v5), H-session 3 (v3, v4, v5). v6, the v7
# attempts and v8 were not scored. v9 is scored on them at most once, only if it passes the
# internal screen below.
#
# Bags, segments and roles: exactly those of w2-trackperc-v5-2026-11-25.yaml (copied unchanged;
# only split_id differs).
#
# Labels for training, model selection and the screen: car-data/pnp/labels/selflabels-v5-arc
# (selflabel --arc-length-stations --corner-smooth-m 0.1, see w2-trackperc-v8-2026-11-25.yaml).
# Internal validation plan w2-v6.
#
# Recipe space (between v8's two stage-1 settings, where v8 sat on the screen limits from both
# sides): stage 1 the v4 recipe (init v2 seed 1, 6 epochs, w2-v6 plan, arc labels) with
# train --spacing-weight in {0.03, 0.05}; stage 2 the v5 sigma-head refit (1 epoch) with
# train --real-label-sigma-near in {0.15, 0.20}. Four configurations, seed 0 each.
# Selection: among the configurations whose seed 0 passes every screen item, the one with the lowest
# session 2 E_c (arc labels); none passing -> v9 FAILS. That configuration is trained with seeds 1
# and 2; the seed with the lowest final raw internal E_c (train.select_seed) is v9, and the screen
# is applied to THAT seed (it must pass again; if it does not, v9 FAILS).
#
# Internal screen (decision 38): the v7 screen, items and limits unchanged, on the arc labels only,
# refined; references v2 (trackperc-v2-2026-11-14) and v5-dev (car-data/pnp/runs-v6/v5dev/seed2):
#   1. V >= V(v5-dev) + 0.20 on session 2 and 2026-11-16        (14.95, 15.04)
#   2. V >= V(v2) - 0.10 on session 2 and 2026-11-16, >= V(v2) - 0.25 on the older bags
#                                                                 (15.15, 15.07, 15.15)
#   3. E_c <= E_c(v2) on session 2 and 2026-11-16, <= E_c(v5-dev) on the older bags
#                                                                 (0.1454, 0.1308, 0.0663)
#   4. E_c <= 1.03 E_c(v5-dev) on all three                      (0.1408, 0.1157, 0.0683)
# (limits in brackets: the arc-label internal numbers of the references, measured for v8.) The same
# numbers on the v4-fast labels and the E_c on common stations are reported and decide nothing.
#
# Ship rule if scored: the v4/v5 rule exactly as registered, with v9 in v5's place, on the
# registered labels car-data/pnp/labels/selflabels-v4-fast and the registered gates:
#   on H-layout: E_c(v9) <= E_c(v2) and V(v9) >= V(v2) - 0.25 and C95(v9) >= C95(v2) - 0.02 and
#                mean intrusion(v9) <= max(0.02, intrusion(v2) + 0.005);
#   on H-session: at least 300 labelled scans, E_c(v9) <= 1.05 E_c(v2) and V(v9) >= V(v2) - 0.25;
#   p99 latency of preprocess + net + refinement on the dev Mac at most 1.2 times v2's.
# Scored once with racer_pnp_perception.compare_v5 (v9 passed as --v5). If v9 ships it is published
# in car-data/pnp/models and becomes the prototype profile's perception_bundle (pnp.launch.py and
# the app preset, with the Linux suites).
#
# Stated expectation (before any v9 number): the H E_c items are measured against the v4-fast
# labels, whose corners the arc labels correct. On the internal part, v8 (arc-trained) against
# those labels had older-bag E_c 0.0819 vs v2 0.0743, so the H-layout E_c item (<= v2) is at real
# risk for any arc-trained net even if v9 is better on the arc labels. Proposal, NOT acted on
# (a prereg change for the coordinator/owner): a later rule could score H with arc labels of the H
# bags made by the same flagged labeller, for v2 and the candidate alike.
