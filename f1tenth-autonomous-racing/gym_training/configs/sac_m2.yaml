# m2: from-scratch sac laps spielberg at a 3 m/s cap, randomized starts, no warm start

env:
  maps: [Spielberg]
  num_beams: 108
  features: [scan, linear_vel_x, ang_vel_z, delta, frenet_pose]
  scan_range_max_m: 30.0
  lidar_noise_std: 0.01
  lidar_dropout_prob: 0.0
  lidar_range_bias_std: 0.0
  # grid resets put a single agent on one waypoint every episode, so only the
  # all-track strategies actually spread the starts
  reset_strategy: RL_RANDOM_RANDOM
  reference_line: RACELINE
  continuous_laps: true
  action_repeat: 4          # 25 hz control over the 100 hz physics
  max_episode_steps: 4000   # control steps, so 160 s: a 343 m lap needs 115 s at the cap
  wrong_way_steps: 50
  steer_max_rad: 0.4189
  speed_min_mps: 0.5
  speed_cap_mps: 3.0
  obs_norm:
    speed_mps: 8.0
    yaw_rate_rps: 5.0
    steer_rad: 0.4189
    ey_m: 5.0
  reward:
    w_prog: 1.0
    w_rate: 0.05
    collision_penalty: 10.0
    lap_bonus: 50.0
    target_lap_time_sec: 120.0

algo:
  name: sac
  policy: MlpPolicy
  net_arch: [256, 256]
  learning_rate: 0.0003
  buffer_size: 1000000
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  train_freq: 64
  gradient_steps: 64
  learning_starts: 10000
  ent_coef: auto
  device: cuda

run:
  total_steps: 2000000
  n_envs: 8
  seed: 0
  eval_freq: 50000
  eval_episodes: 10
  checkpoint_freq: 100000
  log_dir: runs
