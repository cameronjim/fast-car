# m4 multi-map: one policy over four tracks at a fixed 5 m/s cap, a generalization check

env:
  # workers take maps round robin by index, and the eval workers cover all four
  maps: [Spielberg, Monza, YasMarina, Catalunya]
  num_beams: 108
  features: [scan, linear_vel_x, ang_vel_z, delta, frenet_pose]
  scan_range_max_m: 30.0
  lidar_noise_std: 0.01
  lidar_dropout_prob: 0.0
  lidar_range_bias_std: 0.0
  reset_strategy: RL_RANDOM_RANDOM
  # monza and yasmarina ship racelines the car does not fit on, but progress is centerline based
  reference_line: RACELINE
  continuous_laps: true
  action_repeat: 4
  max_episode_steps: 4000   # 160 s, so even monza's 446 m centerline laps at the cap
  wrong_way_steps: 50
  steer_max_rad: 0.4189
  speed_min_mps: 0.5
  speed_cap_mps: 5.0
  obs_norm:
    speed_mps: 8.0
    yaw_rate_rps: 5.0
    steer_rad: 0.4189
    ey_m: 5.0
  reward:
    w_prog: 1.0
    w_rate: 0.05
    collision_penalty: 10.0
    lap_bonus: 50.0
    target_lap_time_sec: 90.0

algo:
  name: sac
  policy: MlpPolicy
  net_arch: [256, 256]
  learning_rate: 0.0003
  buffer_size: 400000
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  train_freq: 64
  gradient_steps: 64
  learning_starts: 5000
  ent_coef: auto
  device: cuda

run:
  total_steps: 1500000
  n_envs: 8
  eval_n_envs: 4
  seed: 0
  resume_from: artifacts/m2/best_model.zip
  eval_freq: 50000
  eval_episodes: 12
  checkpoint_freq: 250000
  log_dir: runs
