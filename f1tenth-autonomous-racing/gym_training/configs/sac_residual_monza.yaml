# m5: residual sac over pure pursuit on monza's generated raceline

env:
  maps: [Monza]
  num_beams: 108
  features: [scan, linear_vel_x, ang_vel_z, delta, frenet_pose]
  scan_range_max_m: 30.0
  lidar_noise_std: 0.01
  lidar_dropout_prob: 0.0
  lidar_range_bias_std: 0.0
  reset_strategy: RL_RANDOM_RANDOM
  # monza's shipped raceline clears the walls by 0.19 m, so spawning on it puts the car inside one
  reference_line: CENTERLINE
  continuous_laps: true
  action_repeat: 2
  max_episode_steps: 6000
  wrong_way_steps: 100
  steer_max_rad: 0.4189
  speed_min_mps: 0.5
  speed_cap_mps: 12.0
  residual:
    enabled: true
    reference: generated
    dsteer_max_rad: 0.15
    dspeed_max_mps: 1.5
    curvature_horizons_m: [5.0, 10.0, 15.0, 20.0, 30.0]
    pure_pursuit:
      # the leaderboard's 1.35 only survives a grid start on the line; 1.30 is the fastest
      # scale that laps 16/16 clean from randomized off-line spawns
      speed_scale: 1.30
  obs_norm:
    speed_mps: 12.0
    yaw_rate_rps: 5.0
    steer_rad: 0.4189
    ey_m: 5.0
    ref_lateral_m: 2.0
    curvature_radpm: 0.5
  reward:
    w_prog: 1.0
    w_rate: 0.05
    collision_penalty: 10.0
    lap_bonus: 50.0
    target_lap_time_sec: 60.0

algo:
  name: sac
  policy: MlpPolicy
  net_arch: [256, 256]
  learning_rate: 0.0003
  buffer_size: 600000
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  train_freq: 64
  gradient_steps: 64
  learning_starts: 10000
  ent_coef: auto
  device: cuda

run:
  total_steps: 800000
  n_envs: 8
  eval_n_envs: 4
  seed: 0
  eval_freq: 50000
  eval_episodes: 12
  checkpoint_freq: 250000
  log_dir: runs
