# m4 cap extension: the 8 m/s spielberg policy pushed past the curriculum's original ceiling
#
# the 8.0 winner already laps clean at a 8.5 cap and half clean at 9.0, so the cap, not the
# policy, was the binding constraint. this run raises it in 0.25 m/s steps to find the real one.

env:
  maps: [Spielberg]
  num_beams: 108
  features: [scan, linear_vel_x, ang_vel_z, delta, frenet_pose]
  scan_range_max_m: 30.0
  lidar_noise_std: 0.01
  lidar_dropout_prob: 0.0
  lidar_range_bias_std: 0.0
  reset_strategy: RL_RANDOM_RANDOM
  reference_line: RACELINE
  continuous_laps: true
  action_repeat: 4
  max_episode_steps: 4000
  wrong_way_steps: 50
  steer_max_rad: 0.4189
  speed_min_mps: 0.5
  speed_cap_mps: 8.0
  obs_norm:
    # deliberately left at 8.0 so the warm start transfers exactly; above it the speed
    # feature saturates and the policy reads its speed off the previous action instead
    speed_mps: 8.0
    yaw_rate_rps: 5.0
    steer_rad: 0.4189
    ey_m: 5.0
  reward:
    w_prog: 1.0
    # measured at 0.17% of per-step progress reward at both 4.5 and 8.0, so it never binds
    w_rate: 0.05
    collision_penalty: 10.0
    lap_bonus: 50.0
    target_lap_time_sec: 40.0

curriculum:
  start_cap_mps: 8.0
  max_cap_mps: 9.5
  # finer than the 0.5 of the main run: each step now costs real cornering margin
  step_mps: 0.25
  promote_rate: 0.9
  window_rounds: 2
  cooldown_rounds: 2

algo:
  name: sac
  policy: MlpPolicy
  net_arch: [256, 256]
  learning_rate: 0.0003
  buffer_size: 400000
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  train_freq: 64
  gradient_steps: 64
  learning_starts: 5000
  ent_coef: auto
  device: cuda

run:
  total_steps: 900000
  n_envs: 8
  eval_n_envs: 4
  seed: 0
  resume_from: artifacts/m4/best_model.zip
  eval_freq: 50000
  eval_episodes: 12
  checkpoint_freq: 300000
  log_dir: runs
