# from-scratch ppo on spielberg, cpu is measurably faster than cuda for this mlp

env:
  maps: [Spielberg]
  num_beams: 108
  features: [scan, linear_vel_x, ang_vel_z, delta, frenet_pose]
  scan_range_max_m: 30.0
  lidar_noise_std: 0.01
  lidar_dropout_prob: 0.0
  lidar_range_bias_std: 0.0
  reset_strategy: RL_GRID_STATIC
  reference_line: RACELINE
  continuous_laps: true
  action_repeat: 4
  max_episode_steps: 2000
  wrong_way_steps: 50
  steer_max_rad: 0.4189
  speed_min_mps: 0.5
  speed_cap_mps: 3.0
  obs_norm:
    speed_mps: 8.0
    yaw_rate_rps: 5.0
    steer_rad: 0.4189
    ey_m: 5.0
  reward:
    w_prog: 1.0
    w_rate: 0.05
    collision_penalty: 10.0
    lap_bonus: 50.0
    target_lap_time_sec: 120.0

algo:
  name: ppo
  policy: MlpPolicy
  net_arch: [256, 256]
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 1024
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  device: cpu

run:
  total_steps: 5000000
  n_envs: 8
  seed: 0
  eval_freq: 50000
  eval_episodes: 5
  checkpoint_freq: 100000
  log_dir: runs
