[project]
name = "racer-laps"
version = "0.1.0"
description = """
racer_laps: lap memory for the plug-and-play racer (part D v0). The core (lap_detector,
lap_record, safe_set, cap_schedule, engine) is ROS-free and numpy only so it runs in the L1
CI job; lap_memory_node.py is the rclpy plumbing around it.
"""
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Only `python -m racer_laps.replay` reads bags.
replay = ["mcap>=1.6.0", "mcap-ros2-support>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_laps"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rclpy.*", "ackermann_msgs.*", "nav_msgs.*", "std_msgs.*", "tf2_ros.*", "racer_msgs.*", "racer_pnp_msgs.*", "builtin_interfaces.*", "mcap.*", "mcap_ros2.*"]
ignore_missing_imports = true

# 90 percent line coverage on the ROS-free core. The node and the bag reader need rclpy or a
# bag and are covered by the L3 launch test and by running replay on a real bag.
[tool.coverage.run]
omit = [
    "setup.py",
    "*/lap_memory_node.py",
    "*/__main__.py",
    "tests/test_node_*.py",
]

[tool.coverage.report]
fail_under = 90
