[project]
name = "racer-policy"
version = "0.1.0"
description = """
racer_policy (claude-docs/02-repo-layout.md: "deploy node: contract loader + inference (Py
first)"). This package is the S.5 deliverable: the deployment-contract loader and
refuse-on-mismatch verifier (claude-docs/08-learning.md "Deployment contract"), kept
ROS-free per claude-docs/10-conventions.md ("Gate/decision logic is always separated from
node plumbing so it is testable without ROS") -- the rclpy policy_node that wraps this
loader for 50 Hz inference is a later wiring task (roadmap 5.2). Depends only on pyyaml +
jsonschema; torch is a deploy-time-only dependency, imported lazily inside
`racer_policy.model.load_model` so this package -- and the L1 CI job that exercises the
loader -- never needs it installed (see that module's docstring).
"""
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy",
    "envelope",
]

[tool.uv.sources]
# The layer-4 envelope library is one library shared with training (claude-docs/02-repo-layout.md),
# a sibling directory of the colcon workspace on the car (deploy.ensure_envelope_importable).
envelope = { path = "../../../training/envelope" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_policy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# rclpy and the message packages come from the ROS install, not from this venv; policy_node.py
# is the only module that imports them (lazily, inside functions).
[[tool.mypy.overrides]]
module = ["envelope.*", "rclpy.*", "ackermann_msgs.*", "nav_msgs.*", "sensor_msgs.*", "std_msgs.*", "tf2_ros.*", "racer_tools.*"]
ignore_missing_imports = true

# numpy 2.3+ ships stubs written for python 3.12 syntax, which mypy cannot read with the 3.10
# target above (the car image's python), and pinning numpy below 2.3 would make CI compile it
# from source on newer pythons. The code uses numpy through the NDArray alias only, so mypy does
# not follow into its stubs.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# torch is deliberately NOT a dependency of this package (see src/racer_policy/model.py's
# docstring: it is a deploy-time-only dependency, imported lazily so the L1 CI job never
# needs it installed). mypy therefore cannot see its stubs either; this override is scoped
# to exactly that one module rather than a blanket ignore.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

# What is NOT measured here, and why. policy_node.py is rclpy plumbing (subscriptions, timers,
# publishers); its decisions live in policy_core / startup / live_observation / deploy, which are
# measured. The node itself, the node-startup refusal tests and the live-graph tests need rclpy
# (and, for the last, torch): they skip under this bare `uv run pytest` and run under colcon in
# the ros-dev image and in the l5-policy CI job, so their files would only add skipped lines to the
# total. setup.py is the ament_python packaging shim; policy_fixture.py is a test helper whose
# torch half only runs where torch is installed.
[tool.coverage.run]
omit = [
    "setup.py",
    "*/policy_node.py",
    "tests/test_policy_node_*.py",
    "tests/policy_fixture.py",
]
