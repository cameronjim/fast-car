[project]
name = "racer-policy"
version = "0.1.0"
description = """
racer_policy (claude-docs/02-repo-layout.md: "deploy node: contract loader + inference (Py
first)"). This package is the S.5 deliverable: the deployment-contract loader and
refuse-on-mismatch verifier (claude-docs/08-learning.md "Deployment contract"), kept
ROS-free per claude-docs/10-conventions.md ("Gate/decision logic is always separated from
node plumbing so it is testable without ROS") -- the rclpy policy_node that wraps this
loader for 50 Hz inference is a later wiring task (roadmap 5.2). Depends only on pyyaml +
jsonschema; torch is a deploy-time-only dependency, imported lazily inside
`racer_policy.model.load_model` so this package -- and the L1 CI job that exercises the
loader -- never needs it installed (see that module's docstring).
"""
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_policy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# torch is deliberately NOT a dependency of this package (see src/racer_policy/model.py's
# docstring: it is a deploy-time-only dependency, imported lazily so the L1 CI job never
# needs it installed). mypy therefore cannot see its stubs either; this override is scoped
# to exactly that one module rather than a blanket ignore.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
