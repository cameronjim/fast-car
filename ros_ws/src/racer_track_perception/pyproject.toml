[project]
name = "racer-track-perception"
version = "0.1.0"
description = """
Plug-and-play part A (LiDAR scan to local track). The core modules (preprocess, track,
geometric, selfcheck, runtime, bundle) are ROS-free and numpy-only so they run on the car's
python 3.10 with apt numpy 1.21 and are testable with a bare `uv run pytest`. The rclpy node
(track_perception_node) is the only module that imports ROS.
"""
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_track_perception"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The node is rclpy plumbing; its decisions live in the modules that are measured. The node and
# its launch tests need rclpy and run under colcon in the ros-dev image.
[tool.coverage.run]
omit = [
    "setup.py",
    "*/track_perception_node.py",
    "tests/test_node_*.py",
]
