[project]
name = "racer-gym"
version = "0.1.0"
description = """
racer_gym (roadmap task S.1, claude-docs/02-repo-layout.md, claude-docs/07-sim-and-sysid.md):
an EXTENSION of the pinned f1tenth_gym (see [tool.uv.sources] below) that upgrades its
single-track vehicle model with longitudinal+lateral load transfer, front/rear Pacejka tire
curves, first-order steering/throttle actuator dynamics, and a command-to-torque transport
delay. It does not vendor or modify f1tenth_gym source; it depends on it and replaces the
per-agent model/integrator/action_type objects after construction (see
racer_gym/dynamics/model.py for why that seam is injectable and racer_gym/env.py for the
wiring). Physical constants come from config/vehicle_params.yaml via the generated Python
binding (regenerated at import/test time by tools/gen_params.py, never committed or
hand-written here -- CLAUDE.md invariant 2).
"""
requires-python = ">=3.11,<3.12"
dependencies = [
    "f1tenth_gym",
    "gymnasium>=0.29",
    "numpy",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[tool.uv.sources]
# Same pinned commit as docker/sim-cpu/pyproject.toml (v1.0.0 branch, gymnasium API). Pinned
# to a commit SHA, not a branch, because the branch moves -- see that file's comment for why
# v1.0.0 rather than main.
f1tenth_gym = { git = "https://github.com/f1tenth/f1tenth_gym.git", rev = "5a301bd0ae1ceaf7dec653e7549c8d099db58a6b" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["racer_gym"]
