[project]
name = "gen-params-tool"
version = "0.1.0"
description = """
Dependency manifest for tools/gen_params.py (claude-docs/06-vehicle-params.md rule 3):
generates Python/C++/C bindings from config/vehicle_params.yaml + .schema.json and is
covered by the L1/L2 tests in tools/tests/ per claude-docs/12-testing.md. Not built into a
wheel; tools/conftest.py puts this directory on sys.path so tests can `import gen_params`
directly (see claude-docs/02-repo-layout.md: tools/ is a script directory, not a ROS/Python
package with its own src layout).

Also covers tools/raceline/ (roadmap task S.2): the offline raceline optimizer. It imports
gen_params the same sys.path way and adds numpy for the geometry/speed-profile math; see
tools/raceline/__init__.py for the pipeline.

Also covers tools/replay_follower.py and tools/follower_replay/: bag replay for the gap
follower (docs/notes/replay-follower.md). It reads mcap with mcap + mcap-ros2-support; the PNG
plots need matplotlib, which is the optional `plots` extra so the codegen environment the
colcon build syncs stays small (`uv sync --extra plots`; CI uses --all-extras).

Also covers tools/lap_replay.py: replays a bag (or a folder of images) through the camera lap
counter in ros_ws/src/racer_perception to tune its thresholds (docs/notes/lap-counter-2026-11-12.md).
Decoding the JPEG frames needs OpenCV, the optional `vision` extra (`uv sync --extra vision`).

Also covers tools/pnp_session/ and tools/pnp_session_report.py (brief 34): the car session timing
report (pre-registration PnP v0.3 section 5) and the lap observe check. They need the optional
`session` extra (racer_eval from evaluation/analysis, which brings scipy); codegen does not.
"""
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.11.2",
]
vision = [
    "opencv-python-headless>=4.9",
]
# tools/pnp_session (brief 34) reuses the run finding, the 4.2 counting rule and the planner
# acceptance of evaluation/analysis. It is an extra, not a dependency: the gen_params codegen that
# colcon runs with `uv run --project tools` (also on the Jetson) must not install scipy.
# Run the report with `uv run --project tools --extra session python tools/pnp_session_report.py`.
session = [
    "racer-eval",
]

[tool.uv]
package = false

[tool.uv.sources]
racer-eval = { path = "../evaluation/analysis", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

# tools/racer_app is its own uv project (agent/pyproject.toml, with fastapi and friends that
# this environment does not install) and is tested by its own CI step, so the tools run must not
# collect it. Listed with pytest's default exclusions, which setting this key replaces.
[tool.pytest.ini_options]
norecursedirs = ["racer_app", ".*", "build", "dist", "venv", "*.egg", "node_modules"]
