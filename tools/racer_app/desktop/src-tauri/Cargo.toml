[package]
name = "racer-desktop"
version = "0.1.0"
description = "Racer: desktop shell for the car dashboard (read-only towards ROS)"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "racer_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-http = "=2.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
keyring = "=4.2.0"
mdns-sd = "=0.21.7"
ureq = "=3.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
