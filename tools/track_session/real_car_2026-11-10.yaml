# The car as measured on the floor, 2026-11-10 (scan matching on the foam oval), for the track
# session tools and the sim's "real car" model. These are MEASUREMENTS THAT ARE NOT YET IN
# config/vehicle_params.yaml: branch calib/2026-11-10 is fixing the steering limits, tyre radius
# and gear ratio there. When that lands, these numbers are replaced by the generated binding and
# this file is deleted (CLAUDE.md invariant 2: one source of truth for physical constants). Until
# then every result computed from this file depends on the pending calibration PR; the notes say
# which.
#
# Sign convention (claude-docs/06-vehicle-params.md): steering LEFT positive, radians.
real_car:
  # What a full-lock command is today (vehicle_params steering.max_angle_rad / min_angle_rad,
  # the gym default). The software commands at most this.
  command_full_lock_rad: 0.4189
  # Effective road-wheel angle at full lock, from the measured rear-axle turning radius
  # (wheelbase 0.3302 m): left 0.60 m, right 0.69 m.
  effective_left_lock_rad: 0.504     # 28.9 degrees
  effective_right_lock_rad: 0.449    # 25.7 degrees
  turning_radius_left_m: 0.60
  turning_radius_right_m: 0.69
  # /odom/wheel speed and the speed commands read this many times the true ground speed.
  speed_reading_over_true: 1.401
