[project]
name = "envelope"
version = "0.1.0"
description = """
Safety layer 4 (claude-docs/05-safety.md): the policy envelope -- hard residual bounds,
rate limits, an OOD fallback trigger, and a speed cap. Enforced in the deployment node, not
learned, not trusted from the policy. This is the ONE library imported unmodified by both
the training environment (S.3) and the on-vehicle racer_policy deploy node (S.5); see
claude-docs/02-repo-layout.md ("envelope/ is one library consumed by BOTH training ... and
racer_policy ... Never fork its logic."). Zero runtime dependencies -- pure Python + math --
so importing it on the Jetson deploy path is trivial; the S.3-adjacent OOD scorer this ships
is a simple normalized-distance reference implementation behind an OODScorer interface, not
the real critic-disagreement detector.
"""
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envelope"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    # Only needed to run tools/gen_params.py as a subprocess in
    # tests/test_from_vehicle_params_wiring.py, which regenerates the real Python binding
    # at test time (claude-docs/06-vehicle-params.md rule 3: bindings are generated, never
    # committed). Not a runtime dependency of the envelope library itself.
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
