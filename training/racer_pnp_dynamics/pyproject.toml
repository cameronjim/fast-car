[project]
name = "racer-pnp-dynamics"
version = "0.1.0"
description = """
Part B of the Plug-and-Play Racer (claude-docs/13-plug-and-play.md): an identified bicycle model
of this car with first order speed and steering lags, per side steering gain, a command delay and
an understeer term, fit on the car's own bags, plus a small neural residual that ships enabled
only if it beats the identified model on held-out real data. Offline Python: the output is a
model bundle directory the C++ planner loads and refuses on any mismatch.

torch is only needed to train the residual (dependency group `train`, imported lazily). Bag
reading goes through tools/follower_replay/bag.py and tools/safety_replay/ (the repo's own
reader, calibration and scan matching), put on sys.path by bags.py the way
tools/track_session/extract_bag.py does.
"""
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Not an extra: `uv sync --all-extras` (pytest_gate.sh) must not pull torch into CI.
train = [
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_pnp_dynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
