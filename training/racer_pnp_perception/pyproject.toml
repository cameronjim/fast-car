[project]
name = "racer-pnp-perception"
version = "0.1.0"
description = """
Training and evaluation for the plug-and-play track perception net (circ_conv1d_v0): simulated
lanes with free geometric labels, ray casting with real-scan nuisances, dataset generation,
training, bundle export, the simulation evaluation and the real-bag gate. The numpy forward pass
and the geometric tracer live in ros_ws/src/racer_track_perception, which this package imports.

torch is only in the `train` dependency group and is imported lazily inside functions, so the
per-push CI job (uv sync --all-extras --dev) never installs it. Everything the CI job tests is
numpy only.
"""
requires-python = ">=3.11,<3.12"
dependencies = [
    "racer-track-perception",
    "numpy",
    "pyyaml>=6.0",
]

[tool.uv.sources]
racer-track-perception = { path = "../../ros_ws/src/racer_track_perception" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Real-bag reading (tools/follower_replay/bag.py) and the overlay pictures. Not in dev: the
# per-push job does not read bags.
bags = [
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
    "matplotlib>=3.8",
]
train = [
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_pnp_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: needs torch (the train dependency group); skipped where it is absent",
]

[tool.coverage.run]
omit = [
    "*/train.py",
    "*/export.py",
    "*/eval_bags.py",
    "*/eval_sim.py",
    "*/dataset.py",
]
