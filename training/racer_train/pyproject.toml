[project]
name = "racer-train"
version = "0.1.0"
description = """
racer_train (roadmap task S.3, claude-docs/02-repo-layout.md: "SAC/PPO residual training
package"): the training pipeline for the learned residual policy described in
claude-docs/08-learning.md. `env.py`'s `ResidualRacerEnv` is a gymnasium wrapper around
sim/racer_gym that (a) computes the base pure-pursuit command from a Python port of
ros_ws/src/racer_control's C++ core (raceline.py -- cross-language-divergence-tested, see
tests/test_base_controller_divergence.py and the `test_pure_pursuit_cli_divergence` CTest in
ros_ws/src/racer_control/CMakeLists.txt), (b) takes the policy's action as a bounded residual on
that command, (c) enforces training/envelope's `apply()` -- the SAME library the on-vehicle
racer_policy deploy node uses, never forked (claude-docs/02-repo-layout.md) -- before
stepping the sim, and (d) computes reward as progress along the raceline minus crash minus
envelope violation, nothing else (claude-docs/08-learning.md "Boring choices, committed" /
docs/notes/reward-confessions.md).

`train.py` trains a stable-baselines3 SAC agent (claude-docs/08-learning.md: "Algorithm: SAC
(fallback PPO). No algorithm shopping without a logged reason" -- SB3 is the maintained,
boring choice here rather than a hand-rolled actor-critic implementation, which would only
add a second thing to debug on top of the actual scope of this task: the residual/envelope/
contract wiring) and emits a deployment-contract directory ros_ws/src/racer_policy's
load_contract() can load.

The env module itself (env.py, observation.py, reward.py, raceline.py, envelope_config.py,
config.py, contract_export.py) is torch-free by construction so the L1 CI job
(claude-docs/12-testing.md) never needs torch or stable-baselines3 installed; only train.py
and the nightly training-smoke test import them, and only lazily inside function bodies
(mirroring ros_ws/src/racer_policy/src/racer_policy/model.py's lazy-torch pattern) -- see
train.py's module docstring.
"""
requires-python = ">=3.11,<3.12"
dependencies = [
    "racer-gym",
    "envelope",
    "gymnasium>=0.29",
    "numpy",
    "pyyaml>=6.0",
]

[tool.uv.sources]
# Path deps on the sibling packages this env wraps (claude-docs/02-repo-layout.md:
# "envelope/ is one library consumed by BOTH training ... and racer_policy ... Never fork
# its logic"). racer-policy is a DEV-only path dep (below): the contract round-trip tests
# load an emitted contract back through the real S.5 loader, but nothing in the shipped
# env/train code imports racer_policy at runtime.
#
# editable = true on racer-gym is not a style preference: racer_gym/params.py locates
# config/vehicle_params.yaml and tools/gen_params.py by walking up from its own `__file__`
# (`Path(__file__).resolve().parents[3]`), which only lands on the repo root when
# `__file__` still points at sim/racer_gym's real source tree. A non-editable install
# copies the package into this venv's site-packages, breaking that walk-up (proven by
# hand: `load_vehicle_params()` raised FileNotFoundError for tools/gen_params.py under
# site-packages before this was added). Editable keeps `__file__` pointing at
# sim/racer_gym/racer_gym/params.py, exactly like running racer_gym's own tests in place.
racer-gym = { path = "../../sim/racer_gym", editable = true }
envelope = { path = "../envelope" }
racer-policy = { path = "../../ros_ws/src/racer_policy" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "racer-policy",
]
# Deliberately NOT `[project.optional-dependencies]`: an "extra" is pulled in by
# `uv sync --all-extras`, which .github/scripts/pytest_gate.sh runs unconditionally for
# every package on every push -- that would install torch+stable-baselines3 in the normal L1
# CI job, exactly what claude-docs/12-testing.md's L1/nightly split (training smoke is a
# NIGHTLY item) and this task's scope ask to avoid. A named dependency-group other than
# "dev" is only installed when explicitly requested with `uv sync --group train`, which only
# .github/workflows/nightly.yml's training-smoke step (and a developer running the smoke
# test locally) does.
train = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: nightly-only test (training smoke, claude-docs/12-testing.md L5); skipped when torch/stable-baselines3 are not installed, which is the normal state in the per-push L1 job",
]
